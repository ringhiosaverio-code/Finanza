<meta charset="utf-8">
<title>Finanza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra fissa con le sezioni; una colonna da 1040px; una scheda per titolo con tre blocchi (compra, vendi, quante) che si impilano su telefono */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--surface2:#edf0f5;--ink:#10151d;--ink2:#465062;--muted:#737d8f;--line:#e0e4eb;
  --accent:#2453c9;--accent-ink:#ffffff;--accent-soft:#e7eefc;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#6250d6;--s6:#cf3f7a;
  --good:#0ca30c;--crit:#d03b3b;--warn:#fab219;--neutral:#c3c2b7;
  --good-ink:#0a7a0a;--crit-ink:#b42c2c;--warn-soft:#fff6de;--good-soft:#e8f6e8;--crit-soft:#fbeaea;
  --band-out:#d3e5fb;--band-in:#8db9ef;--median:#184f95;
  --shadow:0 1px 2px rgba(16,21,29,.05),0 4px 16px rgba(16,21,29,.04);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0d1015;--surface:#151920;--surface2:#1c212a;--ink:#eef0f3;--ink2:#b5bcc8;--muted:#818b9a;--line:#262c37;
  --accent:#6f95f2;--accent-ink:#0d1015;--accent-soft:#1b2640;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--s6:#e2669a;--neutral:#55575c;
  --good-ink:#35c435;--crit-ink:#f07272;--warn-soft:#2c2414;--good-soft:#14281a;--crit-soft:#301a1a;
  --band-out:#123a6b;--band-in:#1f5fae;--median:#c4dcf8;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0d1015;--surface:#151920;--surface2:#1c212a;--ink:#eef0f3;--ink2:#b5bcc8;--muted:#818b9a;--line:#262c37;
  --accent:#6f95f2;--accent-ink:#0d1015;--accent-soft:#1b2640;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--s6:#e2669a;--neutral:#55575c;
  --good-ink:#35c435;--crit-ink:#f07272;--warn-soft:#2c2414;--good-soft:#14281a;--crit-soft:#301a1a;
  --band-out:#123a6b;--band-in:#1f5fae;--median:#c4dcf8;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-head);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.2}h2{font-size:20px}h3{font-size:16px}h4{font-size:14px}
p{margin:0}
.sub{color:var(--ink2)}
.note{color:var(--muted);font-size:13px}
.pos{color:var(--good-ink)}.neg{color:var(--crit-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0}
.brand b{font-family:var(--f-head);font-size:21px;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex-wrap:wrap;row-gap:2px}
.brand #live{overflow:visible;margin-left:0;flex:0 0 auto}
.brand #live span{overflow:visible}
nav.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:9px 12px 10px;color:var(--ink2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.view > *{min-width:0}

/* blocchi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card > h2 + .sub,.card > h3 + .sub{margin-top:4px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#10151d;display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.alert p{font-size:14px;color:var(--ink2)}
.alert b{color:var(--ink)}
.alert code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:13px;user-select:all;white-space:nowrap}
@media (max-width:560px){.pac .nm2{display:none}.pac td,.pac th{padding-left:4px;padding-right:4px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps b{color:var(--ink)}
ol.steps{margin:0;padding:0}

/* scelta della regola */
.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts.h{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.s{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .n{font-weight:600}
.opt .d{font-size:12.5px;color:var(--ink2)}
.opt .p{font-family:var(--f-head);font-weight:600;font-size:18px;margin-top:4px}
.opt .p small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.choose{display:grid;gap:16px}
.outcome{border-radius:12px;background:var(--surface2);padding:12px 14px;font-size:14.5px;color:var(--ink2)}
.outcome b{color:var(--ink)}
.acct{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.acct .f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.acct input{width:130px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}

/* scheda titolo */
.picks{display:grid;gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px;min-width:0}
.pick .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick .rk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.pick .id{flex:1 1 160px;min-width:0}
.pick .tk{font-family:var(--f-head);font-weight:700;font-size:20px;margin-right:8px}
.pick .nm{color:var(--ink2);font-size:13.5px}
.pick .pr{display:flex;align-items:center;gap:10px}
.pick .pv{font-family:var(--f-head);font-weight:700;font-size:26px;line-height:1}
.pick .pl{font-size:12px;color:var(--muted);line-height:1.3}
.meter{position:relative;width:96px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:4px}
.meter::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--muted)}
.trio{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.trio > div{border-radius:12px;padding:10px 12px;background:var(--surface2);min-width:0}
.trio .k{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.trio .big{font-family:var(--f-head);font-weight:600;font-size:18px}
.trio small{display:block;color:var(--ink2);font-size:12.5px}
.trio .sell{display:grid;gap:2px;font-size:14px}
.why{font-size:14px;color:var(--ink2)}
.why b{color:var(--ink)}
.more{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.more[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
.more-body{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.two > *{min-width:0}
.entry-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.entry-in input{width:110px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit}
.bar{display:flex;gap:2px;height:14px}
.bar i{display:block;height:100%;border-radius:3px;min-width:2px}
.oc{display:grid;gap:12px;margin-top:10px}
.oc .r{display:grid;grid-template-columns:minmax(110px,160px) 1fr 64px;gap:10px;align-items:center}
.oc .r .t{font-size:13px;color:var(--ink2)}
.oc .r .t small{display:block;color:var(--muted);font-size:11.5px}
.oc .r .g{font-family:var(--f-head);font-weight:600;font-size:18px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;border-radius:1px;vertical-align:3px}
.legend i.dash{height:0;border-top:2px dashed currentColor;background:none;vertical-align:3px}

/* grafici */
.chart{position:relative;margin-top:8px;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);display:none;white-space:nowrap;z-index:3}
.tip .t{font-weight:600;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.tip .r span:last-child{color:var(--ink)}

/* verifica: confronto delle regole */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:12px}
.rg h4{margin-bottom:6px;color:var(--ink2)}
.rb{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left}
.rb:hover{background:var(--surface2)}
.rb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rb .rn{font-size:13.5px}
.rb .rv{font-weight:600;text-align:right}
.rb .rx{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.track{position:relative;height:10px;border-radius:5px;background:var(--surface2)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--s1)}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--ink2)}
.stat .v{font-family:var(--f-head);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat .d{font-size:12px;color:var(--muted)}
.ctlrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tabelle */
.scroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
table.stretta th,table.stretta td{padding:6px 4px}
table.stretta th{white-space:normal;vertical-align:bottom}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
details > summary{cursor:pointer;color:var(--ink2);font-size:14px}
details[open] > summary{margin-bottom:10px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty code{background:var(--surface2);padding:2px 6px;border-radius:6px}
.prose{max-width:68ch;display:grid;gap:10px;color:var(--ink2)}
.prose b{color:var(--ink)}
.prose h3{color:var(--ink);margin-top:8px}
footer{color:var(--muted);font-size:12.5px}

/* simula */
.simf{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.simf > *{min-width:0}
.simrow{display:flex;gap:8px}
.simrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:17px;letter-spacing:.03em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px}
.simrow input:focus{border-color:var(--accent);outline:none}
.go{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 20px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chipb:hover{border-color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--ink2);justify-self:start;background:var(--surface)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.alta::before{background:var(--good)}.chip.media::before{background:var(--warn)}.chip.bassa::before{background:var(--crit)}
.simres{display:grid;gap:16px}
.simres > *{min-width:0}
.simhd{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:flex-start}
.simhd .last{display:grid;text-align:right}
.simhd .last .k{font-size:12px;color:var(--muted)}
.simhd .last b{font-family:var(--f-head);font-size:22px}
.simhd .last small{color:var(--muted);font-size:12px}
.hz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.hzc{background:var(--surface2);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.hzc.cons{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.lvq{display:block;margin-top:2px;font-size:12.5px;color:var(--ink2);font-weight:400;white-space:normal}
.lvq:empty{display:none}
.lvq b{color:var(--ink)}
.lvd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px;animation:lvp 2s ease-in-out infinite}
.lvd.off{background:var(--muted);animation:none}
.lvd.err{background:var(--crit);animation:none}
@keyframes lvp{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lvd{animation:none}}
#live{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.lvbtn{font:inherit;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer}
#live-info{margin-top:12px}
.hzc .k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hzc .pr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.hzc .pv{font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1;white-space:nowrap}
.hzc .pl{font-size:12px;color:var(--muted);line-height:1.3}
.hzc small{color:var(--ink2);font-size:12.5px}
.hzc small.note{color:var(--muted)}
.hzc .meter{width:100%}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ask code{background:var(--surface2);padding:6px 10px;border-radius:8px;font-size:14px;user-select:all}

/* giudizio */
.verdetto{border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:12px;padding:12px 16px;background:var(--surface);display:grid;gap:10px}
.verdetto.v-si{--vc:var(--good)}.verdetto.v-cautela{--vc:var(--warn)}.verdetto.v-no{--vc:var(--crit)}
.verdetto .vh{display:flex;gap:12px;align-items:flex-start}
.verdetto .vi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--vc);color:#fff;display:grid;place-items:center;font-weight:700}
.verdetto.v-cautela .vi{color:#10151d}
.verdetto .vh b{font-family:var(--f-head);font-size:17px}
.verdetto .vh p{color:var(--ink2);font-size:14px}
.vcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px 20px}
.vcols > *{min-width:0}
.vcols h4{font-size:13px;color:var(--ink2);margin-bottom:4px}
.vcols ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink2)}
.vcols b{color:var(--ink)}
.verdetto details > summary{font-size:13.5px}
.verdetto details[open] > summary{margin-bottom:8px}

/* portafoglio, demo, crypto, altro */
.act{flex:none;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.04em;border-radius:10px;padding:6px 12px;color:#fff;background:var(--ac,var(--muted))}
.act-si .act,.act-mini{--ac:var(--good)}.act-no .act{--ac:var(--crit)}.act-cautela .act{--ac:var(--s1)}
.act-mini{font-size:11.5px;padding:3px 8px;border-radius:7px;color:#fff;background:var(--good);font-weight:700;letter-spacing:.04em}
.pick.act-no{border-left:5px solid var(--crit)}.pick.act-si{border-left:5px solid var(--good)}.pick.act-cautela{border-left:5px solid var(--s1)}
.row-buy{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row-buy .pv-mini{font-family:var(--f-head);font-weight:700;margin-left:auto}
.linkb{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.reg{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px;max-height:420px;overflow-y:auto}
.reg li{padding:6px 0;border-bottom:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em;background:var(--surface2);color:var(--ink2)}
.tag.in{background:var(--accent-soft);color:var(--ink)}.tag.ok{color:var(--good)}.tag.ko{color:var(--crit)}
.reg .ora{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-right:2px}
.reg li.nuova{background:var(--accent-soft);border-radius:8px;padding-left:8px;padding-right:8px;border-bottom-color:transparent}

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
let mkt = D.mercati.usa ? 'usa' : 'italia';
let S = D.mercati[mkt];
function setMkt(m) { if (D.mercati[m]) { mkt = m; S = D.mercati[m]; } }
const $ = (s, r = document) => r.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nf = (x, d = 2) => Number(x).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
const pc = (x, d = 1, sign = true) => { if (x == null) return 'n/d'; let v = x * 100; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return (sign && v > 0 ? '+' : '') + nf(v, d) + ' %'; };
const p100 = x => x == null ? 'n/d' : Math.round(x * 100) + ' %';
const usd = x => x == null ? '–' : nf(x, 2) + ' $';
const money = x => x == null ? '–' : nf(x, Math.abs(x) < 10 ? 3 : 2) + ' ' + S.mercato.valuta;
const tk = s => String(s).replace(/\.MI$|-EUR$/, '');
const dt = (s, o) => new Date(s + 'T12:00:00Z').toLocaleDateString('it-IT', Object.assign({timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short'}, o || {}));
const dtl = s => dt(s, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------------- stato (ricordato solo in questo browser) ---------------- */
const DEF = S.rules.default;
const st = Object.assign({style: DEF.style, hold: DEF.hold, cap: 10000, risk: 100, maxpct: 15, trend: false, open: {}, entry: {}, vmkt: null}, load());
st.open = {}; st.entry = {};
function load() { try { const x = JSON.parse(localStorage.getItem('finanza-app-v3') || '{}'); return x && typeof x === 'object' ? x : {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem('finanza-app-v3', JSON.stringify({style: st.style, hold: st.hold, cap: st.cap, risk: st.risk, maxpct: st.maxpct, trend: st.trend})); } catch (e) {} }
const key = (s = st.style, h = st.hold) => `${s}|${h}`;
const model = (s, h) => S.models[key(s, h)];
const styleOf = id => S.rules.styles.find(s => s.id === id);
const holdName = h => S.rules.hold_names[h];
const prob = c => model().p[c.g];
const GROUP_NAMES = ['tra i più deboli', 'sotto la media', 'nella media', 'sopra la media', 'tra i più forti'];
const GROUP_SHORT = ['Più deboli', 'Sotto media', 'Nella media', 'Sopra media', 'Più forti'];
if (!S.rules.styles.some(s => s.id === st.style)) st.style = DEF.style;
if (!S.rules.holds.includes(st.hold)) st.hold = DEF.hold;

/* ---------------- sezioni ---------------- */
const VIEWS = ['oggi', 'portafoglio', 'demo', 'giornata', 'crypto', 'simula', 'altro', 'consigli', 'italia', 'verifica', 'daytrade', 'metodo', 'libri'];
let view = null;
function route() {
  let v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'oggi';
  if (v === 'italia' && !D.mercati.italia) v = 'consigli';
  if (v === 'consigli' && !D.mercati.usa) v = 'italia';
  view = v;
  const sec = v === 'italia' ? 'consigli' : v;
  ['oggi', 'portafoglio', 'demo', 'giornata', 'crypto', 'altro', 'consigli', 'simula', 'verifica', 'daytrade', 'metodo', 'libri'].forEach(x => { $('#v-' + x).hidden = x !== sec; });
  const navv = ['consigli', 'italia', 'verifica', 'daytrade', 'metodo', 'libri'].includes(v) ? 'altro' : v;
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === navv ? 'page' : 'false'));
  if (sec === 'consigli') { setMkt(v === 'italia' ? 'italia' : 'usa'); st.vmkt = mkt; renderConsigli(); }
  else if (sec === 'verifica') { setMkt(st.vmkt || mkt); renderVerifica(); }
  else if (sec === 'oggi') renderOggi();
  else if (sec === 'portafoglio') renderPortafoglio();
  else if (sec === 'demo') renderDemo();
  else if (sec === 'crypto') renderCrypto();
  else if (sec === 'altro') renderAltro();
  else if (sec === 'simula') renderSimula();
  else if (sec === 'daytrade') renderDay();
  else if (sec === 'libri') renderLibri();
  else if (sec === 'giornata') renderGiornata();
  else renderMetodo();
  if (typeof mostraLive === 'function') { mostraLive(); if (LIVE.fonte === 'locale') setTimeout(giroLive, 50); }
  $('#meta').textContent = !['consigli', 'verifica'].includes(sec) ? (D.aggiornato ? `Aggiornato ${dt(D.aggiornato.slice(0, 10))}, ${D.aggiornato.slice(11, 16)}` : '') : `Dati alla chiusura di ${dt(S.asof, {year: 'numeric'})} · ${S.mercato.nome}`;
}
function redraw() { const sec = view === 'italia' ? 'consigli' : view; draw[sec] && draw[sec](); }
window.addEventListener('hashchange', route);

/* ---------------- grafici ---------------- */
const NS = 'http://www.w3.org/2000/svg';
function el(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function text(p, x, y, s, o) { const t = el('text', Object.assign({x, y, 'font-size': 11, fill: css('--muted')}, o || {}), p); t.textContent = s; return t; }
function halo(p, x, y, s, o) { return text(p, x, y, s, Object.assign({'font-size': 12, 'font-weight': 600, fill: css('--ink'), stroke: css('--surface'), 'stroke-width': 4, 'paint-order': 'stroke', 'stroke-linejoin': 'round', 'text-anchor': 'end'}, o || {})); }
function tip(box, h, x, y) { const t = box.querySelector('.tip'); t.innerHTML = h; t.style.display = 'block'; const w = t.offsetWidth, W = box.clientWidth; t.style.left = Math.max(0, Math.min(W - w, x + 14)) + 'px'; t.style.top = Math.max(0, y - 12) + 'px'; }
function untip(box) { const t = box.querySelector('.tip'); if (t) t.style.display = 'none'; }
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= raw) return k * p; return 10 * p; }
function frame(box, H, label) { box.querySelector('svg')?.remove(); const W = box.clientWidth || 600; const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': label}); box.prepend(svg); return [svg, W]; }
function yGrid(svg, m, W, y, lo, hi, fmt) {
  const step = niceStep((hi - lo) / 5);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css('--line'), 'stroke-width': 1}, svg);
    text(svg, m.l - 8, y(v) + 4, fmt(v, step), {'text-anchor': 'end'});
  }
}
function xLabels(svg, n, x, H, lab, every, minGap) {
  const idx = []; for (let i = 0; i < n; i++) if (every(i)) idx.push(i);
  const end = idx[idx.length - 1] === n - 1; let last = -1e9;
  idx.forEach(i => {
    if (x(i) - last < minGap) return;
    if (end && i !== n - 1 && x(n - 1) - x(i) < minGap) return;
    text(svg, x(i), H - 8, lab(i), {'text-anchor': i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}); last = x(i);
  });
}
function crosshair(svg, box, m, W, H, n, x, onIdx) {
  const cross = el('line', {y1: m.t, y2: H - m.b, stroke: css('--muted'), 'stroke-width': 1, visibility: 'hidden', 'stroke-dasharray': '2 3'}, svg);
  const hit = el('rect', {x: m.l, y: m.t, width: Math.max(0, W - m.l - m.r), height: Math.max(0, H - m.t - m.b), fill: 'transparent'}, svg);
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    const h = onIdx(i, true); tip(box, h, x(i) * r.width / W, ev.clientY - r.top);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); onIdx(-1, false); untip(box); });
}
const swatch = c => `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:6px"></i>`;

/* Grafico del prezzo: chiusure, media a 200 giorni, livelli della regola */
function priceChart(box, p, lv) {
  const H = Math.max(230, Math.min(320, (box.clientWidth || 600) * 0.42));
  const [svg, W] = frame(box, H, 'Prezzo di ' + tk(p.symbol) + ' negli ultimi 6 mesi');
  const m = {l: 52, r: 10, t: 14, b: 26}, C = p.chart, n = C.close.length;
  const vals = C.close.concat(C.sma.filter(v => v != null), [lv.limit, lv.stop, lv.target].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / (n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => dt(C.dates[i], {weekday: undefined, day: undefined, month: 'short'}), i => i === 0 || C.dates[i].slice(5, 7) !== C.dates[i - 1].slice(5, 7), W < 520 ? 52 : 40);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);
  const path = arr => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; }); return d; };
  el('path', {d: path(C.sma), fill: 'none', stroke: css('--muted'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4'}, svg);
  el('path', {d: path(C.close), fill: 'none', stroke: css('--s1'), 'stroke-width': 2, 'stroke-linejoin': 'round'}, svg);
  const lines = [[lv.target, 'Obiettivo ' + nf(lv.target), '--good', ''], [lv.limit, 'Prezzo max ' + nf(lv.limit), '--accent', '4 4'], [lv.stop, 'Protezione ' + nf(lv.stop), '--crit', '']].filter(a => a[0] != null);
  lines.forEach(([v, lab, c, dash], k) => {
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css(c), 'stroke-width': 1.5, 'stroke-dasharray': dash}, svg);
    halo(svg, m.l + 6, (lab.startsWith('Protezione') ? y(v) + 15 : y(v) - 6), lab, {'text-anchor': 'start'});
  });
  const dot = el('circle', {r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg);
  el('circle', {cx: x(n - 1), cy: y(C.close[n - 1]), r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2}, svg);
  crosshair(svg, box, m, W, H, n, x, (i, on) => {
    if (!on) { dot.setAttribute('visibility', 'hidden'); return ''; }
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(C.close[i])); dot.setAttribute('visibility', 'visible');
    return `<div class="t">${dt(C.dates[i], {year: 'numeric'})}</div><div class="r"><span>${swatch(css('--s1'))}Chiusura</span><span>${money(C.close[i])}</span></div>` +
      (C.sma[i] != null ? `<div class="r"><span>Media 200 giorni</span><span>${money(C.sma[i])}</span></div>` : '');
  });
}

/* Ventaglio: percentili 5/25/50/75/95 per ogni passo, con i livelli */
function fanChart(box, bands, labels, lv, label, timeFmt) {
  const H = Math.max(230, Math.min(330, (box.clientWidth || 600) * 0.44));
  const [svg, W] = frame(box, H, label);
  const m = {l: 52, r: 10, t: 16, b: 26}, n = bands.length;
  const vals = bands.flatMap(b => [b[0], b[4]]).concat([lv.stop, lv.target, lv.entry].filter(v => v != null && isFinite(v)));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => labels[i], timeFmt.every, W < 520 ? 60 : 44);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);
  const area = (a, b) => 'M' + bands.map((r, i) => x(i) + ',' + y(r[a])).join('L') + 'L' + bands.map((r, i) => [i, r]).reverse().map(([i, r]) => x(i) + ',' + y(r[b])).join('L') + 'Z';
  el('path', {d: area(0, 4), fill: css('--band-out')}, svg);
  el('path', {d: area(1, 3), fill: css('--band-in')}, svg);
  el('path', {d: 'M' + bands.map((r, i) => x(i) + ',' + y(r[2])).join('L'), fill: 'none', stroke: css('--median'), 'stroke-width': 2, 'stroke-linejoin': 'round'}, svg);
  [[lv.target, 'Obiettivo ', '--good', ''], [lv.entry, lv.entryLabel || 'Entrata ', '--muted', '4 4'], [lv.stop, 'Protezione ', '--crit', '']].forEach(([v, lab, c, dash]) => {
    if (v == null || !isFinite(v)) return;
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css(c), 'stroke-width': 2, 'stroke-dasharray': dash}, svg);
    halo(svg, W - m.r, lab === 'Protezione ' ? y(v) + 15 : y(v) - 6, lab + nf(v));
  });
  const dot = el('circle', {r: 4.5, fill: css('--median'), stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg);
  crosshair(svg, box, m, W, H, n, x, (i, on) => {
    if (!on) { dot.setAttribute('visibility', 'hidden'); return ''; }
    const b = bands[i]; dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(b[2])); dot.setAttribute('visibility', 'visible');
    return `<div class="t">${timeFmt.tip(i)}</div>` + [['1 caso su 20 sopra', b[4]], ['1 su 4 sopra', b[3]], ['Caso centrale', b[2]], ['1 su 4 sotto', b[1]], ['1 su 20 sotto', b[0]]].map(([k, v]) => `<div class="r"><span>${k}</span><span>${nf(v)}</span></div>`).join('');
  });
}



/* Barre degli esiti (obiettivo / data / protezione) in HTML */
function outcomeRow(label, small, s) {
  if (!s || !s.n) return `<div class="r"><div class="t">${label}<small>${small}</small></div><div class="note">Nessun caso</div><div class="g">n/d</div></div>`;
  const sg = (p, c, t) => p > 0 ? `<i style="width:${(p * 100).toFixed(1)}%;background:var(${c})" title="${t}: ${p100(p)}"></i>` : '';
  return `<div class="r"><div class="t">${label}<small>${small}</small></div>
    <div><div class="bar" role="img" aria-label="obiettivo ${p100(s.p_target)}, alla data ${p100(s.p_tempo)}, protezione ${p100(s.p_stop)}">${sg(s.p_target, '--good', 'Obiettivo raggiunto')}${sg(s.p_tempo, '--neutral', 'Venduto alla data')}${sg(s.p_stop, '--crit', 'Protezione scattata')}</div>
    <div class="note" style="margin-top:3px">di solito ${pc(s.median)} · 1 volta su 10 sotto ${pc(s.p10, 0)}, 1 su 10 sopra ${pc(s.p90, 0)}</div></div>
    <div class="g" title="In guadagno">${p100(s.p_gain)}</div></div>`;
}
const ocLegend = `<div class="legend"><span><i style="background:var(--good)"></i>Obiettivo raggiunto</span><span><i style="background:var(--neutral)"></i>Venduto alla data</span><span><i style="background:var(--crit)"></i>Protezione scattata</span><span>A destra: quante volte in guadagno</span></div>`;

/* ---------------- simulazione nel browser (Macchina del Tempo) ---------------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mcCache = {};
function timeMachine(c, lv, trend) {
  const ck = [mkt, c.symbol, key(), lv.entry.toFixed(4), trend].join('/');
  if (mcCache[ck]) return mcCache[ck];
  const B = S.details[c.symbol].bars, nb = B.length, hold = st.hold, N = 10000, rand = rng(19);
  let adj = 1;
  if (!trend) { let mu = 0; for (const b of B) mu += Math.log(b[3]); adj = Math.exp(-mu / nb); }
  const stop = lv.stop == null ? -Infinity : lv.stop, target = lv.target == null ? Infinity : lv.target, entry = lv.entry;
  const closes = Array.from({length: hold}, () => new Float64Array(N));
  const rets = new Float64Array(N); let nT = 0, nS = 0, nD = 0;
  for (let n = 0; n < N; n++) {
    let prev = entry, done = false, ret = 0;
    for (let d = 0; d < hold; d++) {
      const b = B[(rand() * nb) | 0];
      const o = prev * b[0] * adj, h = prev * b[1] * adj, l = prev * b[2] * adj, cl = prev * b[3] * adj;
      closes[d][n] = cl;
      if (!done) {
        if (d > 0 && o <= stop) { done = true; ret = o / entry - 1; nS++; }
        else if (d > 0 && o >= target) { done = true; ret = o / entry - 1; nT++; }
        else if (l <= stop) { done = true; ret = stop / entry - 1; nS++; }
        else if (h >= target) { done = true; ret = target / entry - 1; nT++; }
        else if (d === hold - 1) { done = true; ret = cl / entry - 1; nD++; }
      }
      prev = cl;
    }
    rets[n] = ret - S.costo;
  }
  const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(f * (arr.length - 1)))];
  const bands = [[entry, entry, entry, entry, entry]];
  for (const cl of closes) { cl.sort(); bands.push([q(cl, .05), q(cl, .25), q(cl, .5), q(cl, .75), q(cl, .95)]); }
  const r = rets.slice().sort(); let g = 0; for (const v of rets) if (v > 0) g++;
  return (mcCache[ck] = {n: N, p_target: nT / N, p_stop: nS / N, p_tempo: nD / N, p_gain: g / N, median: q(r, .5), p10: q(r, .1), p90: q(r, .9), bands});
}

/* ---------------- titoli consigliati ---------------- */
function levels(c, entry) {
  const sty = styleOf(st.style), a = c.atr;
  return {entry, limit: c.price + S.rules.limit_atr * a, stop: sty.ks ? entry - sty.ks * a : null,
          target: sty.ks && sty.rr ? entry + sty.rr * sty.ks * a : null, entryDay: S.future_days[0], exitDay: S.future_days[st.hold - 1]};
}
function sizing(lv) {
  const byCap = Math.floor(st.cap * st.maxpct / 100 / lv.entry);
  const byRisk = lv.stop != null ? Math.floor(st.risk / (lv.entry - lv.stop)) : Infinity;
  const sh = Math.max(0, Math.min(byCap, byRisk));
  return {sh, amount: sh * lv.entry, loss: lv.stop != null ? sh * (lv.entry - lv.stop) : null};
}
function ranked() { return S.candidates.slice().sort((a, b) => prob(b) - prob(a) || b.forza - a.forza); }
function whyText(c) {
  const i = c.info, parts = [];
  parts.push(`<b>${pc(i.anno, 0)}</b> nell'ultimo anno, forza ${GROUP_NAMES[c.g]} dei candidati`);
  parts.push(i.dal_massimo > -0.02 ? 'quasi al massimo dell’anno' : `${pc(-i.dal_massimo, 0, false)} sotto il massimo dell’anno`);
  parts.push(`${pc(i.sopra_media, 0, false)} sopra la media a 200 giorni`);
  parts.push(`oscilla in media del ${pc(c.atr / c.price, 1, false)} al giorno`);
  return parts.join(' · ');
}

}

function drawSim(s) {
  const k = s.drift[simSt.scen], P = s.prezzo;
  const bands = s.ventaglio.map((b, m) => b.map(x => P * x * Math.exp(k * (s.blocco || 21) * m)));
  const labels = bands.map((_, m) => m ? '+' + m + (m === 1 ? ' mese' : ' mesi') : 'oggi');
  fanChart($('#sim-fan'), bands, labels, {entry: P, entryLabel: 'Oggi ', stop: null, target: null}, 'Ventaglio dei prezzi possibili tra un anno',
    {every: m => m === 0 || m % 3 === 0, tip: m => m ? `Tra ${m} ${m === 1 ? 'mese' : 'mesi'}` : 'Oggi'});
  lineChart($('#sim-line'), s.grafico.dates, s.grafico.close, s.currency);
}
function lineChart(box, dates, vals, c) {
  const H = Math.max(200, Math.min(260, (box.clientWidth || 600) * .5));
  const [svg, W] = frame(box, H, 'Prezzo negli ultimi 5 anni');
  const m = {l: 52, r: 10, t: 12, b: 26}, n = vals.length;
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 1 ? 3 : v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => dates[i].slice(0, 4), i => i > 0 && dates[i].slice(0, 4) !== dates[i - 1].slice(0, 4), 40);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);
  el('path', {d: 'M' + vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L'), fill: 'none', stroke: css('--s1'), 'stroke-width': 2, 'stroke-linejoin': 'round'}, svg);
  el('circle', {cx: x(n - 1), cy: y(vals[n - 1]), r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2}, svg);
  const dot = el('circle', {r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg);
  crosshair(svg, box, m, W, H, n, x, (i, on) => {
    if (!on) { dot.setAttribute('visibility', 'hidden'); return ''; }
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(vals[i])); dot.setAttribute('visibility', 'visible');
    return `<div class="t">${dt(dates[i], {year: 'numeric'})}</div><div class="r"><span>Chiusura</span><span>${cmoney(vals[i], c)}</span></div>`;
  });
}

function catInfo(m) {
  const M = D.mercati[m], key = M.consigliata.key, [sid, h] = key.split('|'), md = M.models[key];
  const sty = M.rules.styles.find(s => s.id === sid);
  const cal = (md.oos && md.oos.calibrazione) || [];
  const n = cal.reduce((s, c) => s + c.n, 0);
  const mae = n ? cal.reduce((s, c) => s + Math.abs(c.stimata - c.osservata) * c.n, 0) / n : null;
  const aff = mae == null ? 'bassa' : mae <= .03 ? 'alta' : mae <= .06 ? 'media' : 'bassa';
  return {M, key, sid, hold: Number(h), md, sty, mae, aff, prot: M.models[`equilibrato|${h}`]};
}

let OGGI = null;
function oggiItems() {

  const items = [];
  for (const [m, one, , col] of CAT) {
    const ci = catInfo(m);
    const list = ci.M.candidates.slice().sort((a, b) => ci.md.p[b.g] - ci.md.p[a.g] || b.forza - a.forza);
    (m === 'usa' || m === 'italia' ? list.slice(0, 5) : list).forEach(c => {
      const s = D.simula && D.simula[c.symbol];
      const hold = s && s.hold ? s.hold : ci.hold, hz = s && (s.orizzonti.find(o => o.giorni === hold) || s.orizzonti[2]);
      items.push({m, one, col, ci, c, s, hold, p: hz ? Math.round(hz.scenari.prudente.p_gain * 100) / 100 : ci.md.p[c.g]});
    });
  }
  const ord = m => CAT.findIndex(x => x[0] === m);
  return (OGGI = items.sort((a, b) => b.p - a.p || ord(a.m) - ord(b.m) || b.c.forza - a.c.forza));

  ${!oggiSt.tutti && filtered.length > 10 ? `<button type="button" class="go" id="o-tutti" style="justify-self:center">Mostra tutti (${filtered.length})</button>` : ''}

  v.querySelectorAll('.filters .chipb').forEach(b => b.addEventListener('click', () => { oggiSt.cat = b.dataset.c; renderOggi(); }));

/* ---------------- archivio personale: portafoglio e conto demo ---------------- */
// Nell'app pubblicata i dati stanno nell'archivio privato di chi la usa (data/users/<id>/...):
// nessun altro li vede e sopravvivono agli aggiornamenti. Aperta come file, solo in questo browser.
const Store = {
  mode: 'local', db: null, uid: null, docs: {}, stato: {}, queue: Promise.resolve(), cbs: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; this.mode = 'db'; }
      }
    } catch (e) { this.mode = 'local'; }
    for (const name of ['portafoglio', 'demo', 'robot']) this.watch(name);
  },
  watch(name) {
    const done = (v, info) => { this.docs[name] = v; this.stato[name] = info; (this.cbs[name] || []).forEach(f => f(v, info)); };
    if (this.mode === 'db') {
      const ref = this.db.doc('data/users/' + this.uid + '/' + name);
      let timer = setTimeout(() => done(this.docs[name] || null, {lento: true}), 10000);
      ref.onSnapshot(s => { if (!s.metadata.fromCache) clearTimeout(timer); done(s.exists ? JSON.parse(JSON.stringify(s.data())) : null, {}); },
                     e => { clearTimeout(timer); done(this.docs[name] || null, {errore: e.code}); });
    } else {
      let v = null; try { v = JSON.parse(localStorage.getItem('finanza-' + name) || 'null'); } catch (e) {}
      done(v, {locale: true});
    }
  },
  on(name, f) { (this.cbs[name] = this.cbs[name] || []).push(f); if (name in this.docs) f(this.docs[name], this.stato[name]); },
  save(name, data) {
    this.docs[name] = data;
    if (this.mode === 'db') {
      const ref = this.db.doc('data/users/' + this.uid + '/' + name);
      this.queue = this.queue.then(() => ref.set(data)).catch(e => avviso('Non riesco a salvare (' + (e && e.code || 'errore') + '). Riprova tra poco.'));
    } else { try { localStorage.setItem('finanza-' + name, JSON.stringify(data)); } catch (e) {} }
    (this.cbs[name] || []).forEach(f => f(data, this.stato[name]));
  },
  nota() {
    return this.mode === 'db' ? 'Salvato nel tuo archivio privato dell’app: lo vedi solo tu, da qualsiasi dispositivo.'
                              : 'Salvato solo in questo browser (aperta fuori da Claude non c’è l’archivio personale).';
  },
};
function avviso(msg) { const t = $('#toast'); if (!t) return; t.textContent = msg; t.hidden = false; clearTimeout(avviso.t); avviso.t = setTimeout(() => { t.hidden = true; }, 4500); }

const dec = x => Math.abs(x) < 1 ? 4 : Math.abs(x) < 10 ? 3 : 2;
const eur = x => x == null ? '–' : nf(x, 2) + ' €';
const fx = s => s.currency === 'USD' && D.cambio ? D.cambio.USD : 1;                  // euro per unità di valuta
const prezzoEur = s => s.prezzo * fx(s);
const oggiData = () => (D.aggiornato || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
function giorniPiu(s, data, n) {
  // la data di vendita: il giorno n contando il giorno di acquisto come primo (giorni di borsa, o di calendario per le crypto)
  if (s.calendario === 'sempre') { const d = new Date(data + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n - 1); return d.toISOString().slice(0, 10); }
  const cal = (D.calendari || {})[s.calendario] || [];
  let i = cal.findIndex(x => x >= data);
  if (i < 0) return null;
  return cal[Math.min(cal.length - 1, i + n - 1)];
}
function giorniTra(s, a, b) {
  if (s.calendario === 'sempre') return Math.round((new Date(b) - new Date(a)) / 864e5);
  const cal = (D.calendari || {})[s.calendario] || [];
  return cal.filter(x => x > a && x <= b).length;
}
const DURATA_NOME = {1: '1 giorno', 5: '1 settimana', 7: '1 settimana', 10: '2 settimane', 21: '1 mese', 30: '1 mese', 63: '3 mesi', 91: '3 mesi', 126: '6 mesi', 182: '6 mesi', 252: '1 anno', 365: '1 anno'};
const holdTxt = s => DURATA_NOME[s.hold] || s.hold + ' giorni';
function picker(id, placeholder) {
  return `<div class="simrow"><input id="${id}" list="all-list" placeholder="${placeholder}" spellcheck="false" autocomplete="off"></div>`;
}
function scelto(id) {
  const q = ($('#' + id) || {}).value || '';
  const r = findSim(q);
  return r && !r.multi ? r : null;
}
const COSTI = s => s.categoria === 'crypto' ? {acq: 0.002, ven: 0.002} : s.categoria === 'italia' ? {acq: 0.002, ven: 0.001} : {acq: 0.001, ven: 0.001};

let PF = null;

function azione(p, s) {
  const g = giudizio(s), uscita = giorniPiu(s, p.data, s.hold), oggi = s.a;
  const bloccato = g.contro.some(x => x.includes('Prezzo quasi fermo'));
  if (bloccato) return {cosa: 'VENDI', classe: 'no', perche: 'Il prezzo è quasi fermo, di solito per un’offerta di acquisto: tenerlo non rende.', uscita, g};
  if (uscita && oggi >= uscita) {
    if (g.livello === 'si') return {cosa: 'RINNOVA', classe: 'si', perche: `È passato il tempo consigliato (${holdTxt(s)}). Puoi venderlo, oppure tenerlo per altri ${holdTxt(s)}: oggi ha ancora buone probabilità (${g.frase.replace(/\.$/, '')}).`, uscita, g};
    return {cosa: 'VENDI', classe: 'no', perche: `È passato il tempo consigliato (${holdTxt(s)}, scaduto ${dt(uscita)}). Oggi il giudizio è "${g.titolo.toLowerCase()}": la regola dice di vendere.`, uscita, g};
  }
  const mancano = uscita ? giorniTra(s, oggi, uscita) : null;
  return {cosa: 'TIENI', classe: 'cautela', perche: `Tienilo fino alla chiusura di ${uscita ? dtl(uscita) : 'n/d'}${mancano != null ? ` (mancano ${mancano} giorni${s.calendario === 'sempre' ? '' : ' di borsa'})` : ''}. La regola: si vende alla data, senza farsi spaventare dal saliscendi, perché dal 2017 le uscite anticipate hanno ridotto le operazioni in guadagno.`, uscita, g};
}

/* ---------------- il pacchetto: i più forti di oggi, in parti uguali ---------------- */
let PAC_CAP = (() => { try { return Number(localStorage.getItem('pac-capitale')) || 10000; } catch (e) { return 10000; } })();
function pacchetto() {
  const P = D.verifica25 && D.verifica25.pacchetti; if (!P || !P.durata) return null;
  const n = Number((P.scelto.match(/\d+/) || [10])[0]), C = [];
  for (const m of ['usa', 'italia', 'etf', 'bond', 'oro']) { const M = D.mercati[m]; if (!M) continue;
    for (const c of M.candidates) if (c.punteggio != null && SIM[c.symbol]) C.push({m, c, s: SIM[c.symbol]}); }
  const g = id => { const x = P.disegni.find(d => d.id === id); return x && x.durate[P.durata]; };
  const sc = P.disegni.find(d => d.id === P.scelto);
  return {P, n, L: C.sort((a, b) => b.c.punteggio - a.c.punteggio).slice(0, n), d: g(P.scelto), tutte: sc.durate,
          primo: g('primo'), caso: g('caso10'), uno: g('uno'), etf: g('etf5'), candidati: C.length};
}
const mese = s => new Date(s + '-15T12:00:00Z').toLocaleDateString('it-IT', {month: 'long', year: 'numeric'});

    return {m, c, s, px, q, i}; });
  const minimo = Math.max(...righe.map(r => r.px * (1 + COSTI(r.s).acq))) * L.length;
  const pegg = d.prima.peggiore <= d.dopo.peggiore ? d.prima : d.dopo;
  const tile = (k, a, b, f) => `<div class="stat"><div class="k">${k}</div><div class="v">${f(a)} <span class="note">·</span> ${f(b)}</div><div class="d">fino al 2016 · dal 2017</div></div>`;

function pacchettoEventi() {
  const i = $('#pac-cap'); if (!i) return;
  i.addEventListener('change', () => { const v = Number(i.value); if (v > 0) { PAC_CAP = v; try { localStorage.setItem('pac-capitale', String(v)); } catch (e) {} renderOggi(); } });
  $('#pac-demo').addEventListener('click', demoPacchetto);
}
function demoPacchetto() {
  const K = pacchetto(); if (!K) return;
  if (DEMO === null) { avviso('Il conto demo si sta ancora caricando: riprova tra un momento.'); return; }
  const gia = K.L.filter(({s}) => (DEMO.posizioni || {})[s.symbol] && DEMO.posizioni[s.symbol].hold).length;
  if (gia * 2 >= K.L.length) { avviso(`Il pacchetto è già nel conto demo (${gia} strumenti su ${K.L.length}): non lo ricompro. Per rifarlo, vendi le posizioni o ricomincia il conto in Esercitati.`); return; }
  const quota = Math.min(PAC_CAP, DEMO.cassa) / K.L.length;
  let cassa = DEMO.cassa, n = 0, tot = 0;
  const pos = Object.assign({}, DEMO.posizioni), mov = (DEMO.movimenti || []).slice();
  for (const {s} of K.L) {
    const c = COSTI(s), px = prezzoEur(s), qty = Math.floor(quota / (px * (1 + c.acq)));
    const speso = qty * px * (1 + c.acq);
    if (!(qty > 0) || speso > cassa + 1e-9) continue;
    cassa -= speso; tot += speso; n++;
    const old = pos[s.symbol];
    pos[s.symbol] = old ? {qty: old.qty + qty, speso: old.speso + speso, data: old.data, hold: old.hold} : {qty, speso, data: s.a, hold: K.P.giorni};
    mov.push({d: s.a, tipo: 'Compra', sym: s.symbol, qty, prezzo: s.prezzo, eur: Math.round(speso * 100) / 100, esito: 'pacchetto'});
  }

function lineaSVG(serie, o = {}) {                                                // linee su un asse con lo zero: serie = [{dati, colore, spessore, tratteggio}]
  const W = 640, H = o.h || 210, ml = 48, mr = 10, mt = 12, mb = 20, wx = W - ml - mr, hy = H - mt - mb;
  const val = serie.flatMap(s => s.dati.filter(v => v != null && isFinite(v)));
  if (!val.length) return '';
  let lo = Math.min(0, ...val), hi = Math.max(0, ...val); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const n = Math.max(...serie.map(s => s.dati.length));
  const X = i => ml + (n <= 1 ? 0 : i / (n - 1)) * wx, Y = v => mt + (1 - (v - lo) / (hi - lo)) * hy;
  const scala = [lo + pad, 0, hi - pad].map(v => `<line x1="${ml}" x2="${W - mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line)"/><text x="${ml - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--muted)">${nf(v, o.dec == null ? 1 : o.dec)}${o.unita || ''}</text>`).join('');
  const righe = serie.map(s => `<polyline fill="none" stroke-linejoin="round" stroke-linecap="round" style="stroke:${s.colore}" stroke-width="${s.spessore || 2}"${s.tratteggio ? ' stroke-dasharray="4 3"' : ''} points="${s.dati.map((v, i) => v == null || !isFinite(v) ? '' : X(i).toFixed(1) + ',' + Y(v).toFixed(1)).filter(Boolean).join(' ')}"/>`).join('');
  const etichette = (o.x || []).map(([i, t]) => `<text x="${X(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(t)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.etichetta || 'Grafico')}">${scala}${righe}${etichette}</svg>`;
}

    ['Moody e Saffell (2001), <i>IEEE Transactions on Neural Networks</i> 12(4):875-889', 'Apprendimento per rinforzo "diretto" per fare trading, con i costi dentro l\'obiettivo.'],
    ['Bailey, Borwein, López de Prado e Zhu, <i>The Probability of Backtest Overfitting</i>, <i>Journal of Computational Finance</i> 20(4); López de Prado (2018), <i>Advances in Financial Machine Learning</i>, Wiley', 'Con molte prove si trova sempre una strategia che "funziona" per caso. Per questo qui si verifica solo su periodi mai visti, con un intervallo di 2 giorni tra addestramento e test, e senza scegliere niente guardando il test.'],

  const info = Rt.informazione, infoRighe = ORIZ.map((m, i) => `<tr><td class="l">${orizTxt(m)}</td><td class="${info.medio[i] >= 0 ? '' : 'neg'}">${nf(info.medio[i], 3)}</td><td class="neg">${pc(info.quinti[i][0], 2)}</td><td class="neg">${pc(info.quinti[i][4], 2)}</td><td class="neg">${pc(info.quinti[i][5], 2)}</td></tr>`).join('');
  return `<div class="card" id="crypto-rete"><h2>Una rete neurale che impara a fare trading sulle crypto</h2>
    <p class="sub" style="margin-top:4px">Una rete neurale scritta da zero (solo numpy), addestrata sugli scambi veri di ${Rt.dati.crypto.length} crypto in euro su Kraken, ${Rt.dati.giorni} giorni, dal ${esc(Rt.dati.da)} al ${esc(Rt.dati.a)}. Ogni quarto d'ora guarda ogni crypto con ${Rt.config.caratteristiche.length} numeri che usano solo il passato (rendimenti su 12 scale di tempo, volatilità, posizione tra minimo e massimo, flusso di acquisti e vendite, ora e giorno) e dà un valore a ogni mossa: aspettare, oppure comprare e tenere ${ORIZ.map(orizTxt).join(', ')}. Ogni acquisto ha una protezione, i costi ci sono tutti, e una crypto ha una sola posizione alla volta: quindi la rete deve scegliere anche <b>quando aspettare</b>.</p>
    <div class="verdetto ${buono ? 'v-si' : 'v-no'}" style="margin-top:12px"><div class="vh"><span class="vi" aria-hidden="true">${buono ? '✓' : '✕'}</span><div><b>${buono ? 'Guadagna nei dati, con cautela' : 'Per ora no: non trova un vantaggio che regga i costi'}</b><p>${verdetto}</p></div></div>
      <details><summary>Perché è una prova onesta, e i suoi limiti</summary><p class="note" style="margin-top:6px">La verifica cammina nel tempo: si addestra sul passato, si sceglie con il mese dopo, si misura sul mese ancora dopo, mai visto (${c0.scelte.length} finestre da 30 giorni, con 2 giorni di intervallo tra l'una e l'altra perché l'esito di un'operazione guarda avanti fino a 2 giorni). Nessun numero del test serve a scegliere qualcosa; per comprare, nel mese di scelta il guadagno deve valere almeno ${Rt.config.t_minima} errori standard sopra zero su almeno ${Rt.config.n_minimo} operazioni, altrimenti la rete resta fuori. Limiti: ${Rt.dati.giorni} giorni sono un solo ciclo di mercato, e questo è stato in gran parte un ribasso; le coppie in euro di Kraken sono sottili; non si può vendere allo scoperto; i costi veri di un cliente piccolo (commissioni e spread) potrebbero essere più alti del ${pc(costo0, 1, false)} per lato usato qui. Non è consulenza finanziaria.</p></details></div>
    <div class="scroll" style="margin-top:12px"><table>
      <thead><tr><th class="l">Fuori campione, ${giorni} giorni</th><th>Operazioni</th><th>Media per operazione</th><th>In guadagno</th><th>Conto, intervallo al 90 %</th><th>Sharpe</th><th>Tempo dentro</th></tr></thead>

    <p class="note" style="margin-top:4px">Costi ${pc(costo0, 1, false)} per lato. Il conto somma i guadagni netti di ogni operazione, ognuna con 1/${Rt.dati.crypto.length} del capitale. "Tempo dentro": quanta parte del tempo c'è una posizione aperta.</p>
    <h3 style="margin-top:16px">Il conto, giorno per giorno</h3>${lineaSVG(conti, {unita: ' %', etichetta: 'Conto fuori campione per strategia', x: [[0, 'inizio'], [giorni, 'fine']]})}
    <div class="note" style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px">${GRAF.map(k => `<span><span style="display:inline-block;width:12px;height:3px;background:${COL[k]};vertical-align:middle;margin-right:4px"></span>${NOMI[k]}</span>`).join('')}</div>
    <h3 style="margin-top:16px">Come ha imparato</h3>
    <p class="note" style="margin-top:2px">Apprendimento per rinforzo (Q-learning su decisioni di durata diversa): il valore di una mossa è il guadagno netto dell'operazione più il valore, scontato, di quando si torna liberi. Il prezzo non dipende dalle nostre operazioni, quindi per ogni istante si sa cosa sarebbe successo con ogni mossa, e l'"esperienza" è la storia riletta a ripetizione: a ogni iterazione la rete riconta il valore delle mosse con la rete dell'iterazione prima e impara di nuovo. A sinistra l'errore di addestramento, che scende (la rete impara); a destra come va la sua politica nel mese di scelta, una linea per finestra e in blu la mediana: non migliora in modo stabile, cioè quello che impara non è un vantaggio che si ripete.</p>

      <div><div class="note">Guadagno medio per operazione nel mese di scelta (%)</div>${lineaSVG(lineeScelta, {h: 170, dec: 2, etichetta: 'Guadagno nel mese di scelta', x: [[0, '1'], [iter - 1, String(iter)]]})}</div></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th class="l">Finestra (test)</th><th class="l">Cosa ha deciso</th><th>Operazioni</th><th>Media</th></tr></thead><tbody>${finestre}</tbody></table></div>
    ${istogramma ? `<p class="note" style="margin-top:6px">Durate scelte nelle operazioni di test: ${istogramma}.</p>` : ''}
    ${sovraHTML}
    <h3 style="margin-top:16px">Se i costi fossero più bassi</h3>
    <p class="note" style="margin-top:2px">Stessa rete, riaddestrata da capo per ogni livello di costo (la commissione e lo spread di ogni operazione, per lato). ${testoCosti}</p>
    <div class="scroll" style="margin-top:6px"><table><thead><tr><th class="l">Costo</th><th>Rete, rinforzo</th><th>Rete, previsione</th><th>Regola: ribasso a 4 ore</th><th>Regola: rialzo a 1 giorno</th></tr></thead><tbody>${costiRighe}</tbody></table></div>
    <p class="note" style="margin-top:4px">Conto sui ${giorni} giorni di test; sotto, media per operazione, operazioni e intervallo al 90 %. ✓: conto positivo con l'intervallo tutto sopra zero.</p>
    <h3 style="margin-top:16px">Perché non ogni secondo</h3>
    <p class="note" style="margin-top:2px">Dagli scambi veri di Kraken, ultimi ${OS.crypto[muroCrypto[0]].giorni} giorni. Un'operazione completa costa ${pc(2 * OS.costo_per_lato, 1, false)} tra entrata e uscita: il prezzo deve muoversi di più. Su Bitcoin c'è almeno uno scambio solo nel ${nf(OS.crypto['BTC-EUR'].secondi_con_scambi * 100, 0)} % dei secondi (circa ${nf(OS.crypto['BTC-EUR'].scambi_ora, 0)} scambi all'ora), su Polkadot nel ${nf(OS.crypto['DOT-EUR'].secondi_con_scambi * 100, 1)} %: per la maggior parte dei secondi il prezzo non cambia affatto.</p>
    <div class="scroll" style="margin-top:6px"><table><thead><tr><th class="l">Orizzonte</th>${muroCrypto.map(s => `<th>${esc(s.replace('-EUR', ''))}: mossa tipica</th><th>più dei costi</th><th>rialzo oltre i costi</th>`).join('')}</tr></thead><tbody>${muro}</tbody></table></div>
    <p class="note" style="margin-top:4px">"Mossa tipica": mediana del valore assoluto della variazione. "Più dei costi": quante volte la mossa, in un verso o nell'altro, supera il costo di un'operazione completa. "Rialzo oltre i costi": quante volte un acquisto avrebbe guadagnato. A un secondo non c'è quasi mai una mossa che valga qualcosa; servono ore.</p>
    <h3 style="margin-top:16px">Cosa sa la rete</h3>
    <p class="note" style="margin-top:2px">Prima di decidere, la rete prevede il guadagno di ogni orizzonte. Fuori campione, la correlazione di rango tra la previsione e quello che è successo è vicina a zero a tutte le durate. Esito medio netto per il quinto di previsioni più basse e più alte, e per il 2 % più alto:</p>
    <div class="scroll" style="margin-top:6px"><table><thead><tr><th class="l">Orizzonte</th><th>Correlazione di rango</th><th>quinto più basso</th><th>quinto più alto</th><th>2 % più alto</th></tr></thead><tbody>${infoRighe}</tbody></table></div>
    <h3 style="margin-top:16px">Cosa dice la ricerca</h3><ul class="note" style="margin:4px 0 0;padding-left:18px;display:grid;gap:5px">${ricerca}</ul>

    ${fontiHTML()}

    ${sentimentoHTML()}
    ${probHTML(c0, Rt.esperienza, 'crypto')}

    <div class="alert" role="note" style="margin-top:12px"><div class="ic" aria-hidden="true">↻</div><p><b>La rete dal vivo, ogni secondo.</b> Sul tuo computer, nella cartella del progetto: <code>python3 rete_dati.py</code> scarica gli scambi di Kraken, <code>python3 rete.py --studia</code> rifà tutta questa verifica (circa 40 minuti) e <code>python3 rete_live.py</code> fa girare la rete in un conto finto con i prezzi di Kraken ogni secondo, impara ancora ogni giorno dai dati nuovi e mostra, per ogni crypto, il vantaggio di comprare sull'attesa. Nella verifica nessun modello ha passato il cancello, quindi di serie resta fuori e non compra mai; con <code>--margine 0.001</code> la costringi a comprare per vedere come impara e cosa perde (con <code>--costo 0.0005</code> usi il modello addestrato con costi più bassi).</p></div></div>`;
}

function ordiniOreHTML() {
  const O = D.intraday && D.intraday.ore; if (!O || !O.crypto) return '';
  const V = O.verifica, K = O.kraken, L = O.livelli, f = x => nf(x, dec(x));
  const hhmm = s => new Date(s.replace(' UTC', 'Z').replace(' ', 'T')).toLocaleString('it-IT', {weekday: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome'});
  const vt = s => s && s.n ? `<b class="${s.media >= 0 ? 'pos' : 'neg'}">${pc(s.media, 2)}</b><br><span class="note">${p100(s.p_gain)} in guadagno · ${s.n} op.</span>` : 'n/d';
  const righe = L.concat([O.rottura]).map(l => { const v = V[l.id], k = K && K.livelli && K.livelli[l.id];
    return `<tr><td class="l" style="white-space:normal"><b>${esc(l.nome)}</b><br><span class="note">${esc(l.desc)}</span></td><td>${vt(v.anno1)}</td><td>${vt(v.anno2)}</td><td>${vt(v.prudente.anno2)}</td><td>${k ? vt(k.base) : 'n/d'}</td><td>${nf(v.al_giorno, 1)}</td></tr>`; }).join('');
  const tuttiPositivi = L.every(l => V[l.id].anno1.media > 0 && V[l.id].anno2.media > 0 && V[l.id].prudente.anno1.media > 0 && V[l.id].prudente.anno2.media > 0);
  const kraken = K && K.livelli && L.every(l => K.livelli[l.id].base.media > 0 && K.livelli[l.id].prudente.media > 0);
  const aGiorno = L.reduce((t, l) => t + V[l.id].al_giorno, 0), medie = L.map(l => V[l.id].anno2.media), mediePr = L.map(l => V[l.id].prudente.anno2.media);
  const items = Object.entries(O.crypto).map(([sym, x]) => ({sym, x, s: SIM[sym]})).filter(o => o.s);
  const aperti = items.flatMap(({x, s}) => (x.posizioni || []).map(p => ({p, s})));
  const nome = id => (L.find(l => l.id === id) || {nome: id}).nome.toLowerCase();
  const ordine = (x, id) => { const p = x.ordini[id]; return p ? `compra a <b>${f(p.entrata)}</b><br><span class="neg">protezione ${f(p.protezione)}</span> · <span class="pos">obiettivo ${f(p.obiettivo)}</span>` : '<span class="note">già in posizione</span>'; };
  const primo = items[0] && items[0].x;
  return `<div class="card" id="crypto-ore"><h2>Intraday: ordini rinnovati ogni ora</h2>
    <div class="alert" role="note" style="margin-top:10px"><div class="ic" aria-hidden="true">!</div><p><b>Correzione del 19 novembre 2026.</b> La prima verifica di questi ordini contava come obiettivo raggiunto anche il massimo della candela in cui scatta l'ordine, che può essere venuto prima del minimo: gonfiava i risultati e li faceva sembrare in guadagno. Corretta, e rifatta minuto per minuto sugli scambi veri di Kraken (400 giorni, 12 crypto), la strategia perde. Il robot la esegue lo stesso, come esercitazione per vedere le operazioni, ma in media perde.</p></div>
    <p class="sub" style="margin-top:8px">Come erano fatti: ogni ora piena, per ogni crypto, tre ordini limite di acquisto sotto il prezzo dell'ultima candela oraria (${L.map(l => nf(l.e, 1)).join(', ')} escursioni orarie), ognuno valido un'ora. Se uno scatta: protezione ${O.stop_escursioni} escursioni sotto l'entrata, obiettivo il prezzo di partenza, fuori al più tardi dopo ${O.tenuta_ore} ore; finché c'è una posizione di quella profondità non se ne aprono altre. Costi ${pc(O.costo_per_lato, 1, false)} per lato. In media circa ${nf(aGiorno, 0)} operazioni al giorno su ${items.length} crypto. L'ora è il passo più fine che si può verificare su 2 anni: Yahoo dà candele da un minuto solo per gli ultimi 7 giorni. Il prezzo si segue poi ogni 5 secondi (<code>live.py</code>) o ogni secondo (<code>crypto_live.py</code>).</p>
    <div class="scroll" style="margin-top:10px"><table>
      <thead><tr><th class="l">Ordine</th><th>Primo anno</th><th>Secondo anno</th><th>Prudente, 2° anno</th><th>Kraken${K ? `, ${K.giorni} giorni` : ''}</th><th>Al giorno</th></tr></thead>
      <tbody>${righe}</tbody></table></div>
    <p class="note" style="margin-top:4px">Media per operazione dopo i costi, e quante in guadagno. <b>Prudente</b>: l'ordine scatta solo se il prezzo scende un quarto di escursione sotto il livello. <b>Kraken</b>: gli stessi ordini sulle candele di un exchange vero in euro.</p>
    <div class="verdetto ${tuttiPositivi ? 'v-cautela' : 'v-no'}" style="margin-top:12px"><div class="vh"><span class="vi" aria-hidden="true">${tuttiPositivi ? '!' : '✕'}</span><div><b>${tuttiPositivi ? 'In guadagno nei dati, con cautela' : 'Per ora no'}</b><p>${tuttiPositivi
      ? `Tutti e tre i livelli hanno guadagnato in media dopo i costi in entrambi gli anni (secondo anno: da ${pc(Math.min(...medie), 2)} a ${pc(Math.max(...medie), 2)} a operazione; nella prova prudente da ${pc(Math.min(...mediePr), 2)} a ${pc(Math.max(...mediePr), 2)})${kraken ? ` e anche su Kraken negli ultimi ${K.giorni} giorni` : ''}. La rottura, con lo stesso passo orario, perde. Se l'ordine vale 2 ore o più perde anche il ribasso: le entrate arrivano dentro un ribasso che continua.`
      : `Con la verifica corretta i tre livelli perdono in media dopo i costi (secondo anno: da ${pc(Math.min(...medie), 2)} a ${pc(Math.max(...medie), 2)} a operazione${K && K.livelli ? `; su Kraken negli ultimi ${K.giorni} giorni: da ${pc(Math.min(...L.map(l => K.livelli[l.id].base.media)), 2)} a ${pc(Math.max(...L.map(l => K.livelli[l.id].base.media)), 2)}` : ''}). Un ordine limite sul ribasso si esegue proprio mentre il prezzo scende, e spesso scende ancora: la protezione scatta quasi quanto l'obiettivo si raggiunge, e con 0,4 % di costi tra entrata e uscita non resta niente.`}</p></div></div>
      <details><summary>Come ci si era sbagliati</summary><p class="note" style="margin-top:6px">Con candele di un'ora, un ordine che scatta e un massimo nella stessa candela contavano come un acquisto seguito da una vendita all'obiettivo. Ma l'obiettivo è il prezzo di partenza, e la candela dopo apre di solito proprio lì: il massimo è quasi sempre venuto prima del ribasso, cioè prima dell'acquisto. Contando l'obiettivo solo dalla candela dopo, e rifacendo tutto minuto per minuto sugli scambi (un ordine fermo si esegue solo se qualcuno vende a mercato sotto il suo prezzo), la media è negativa in ogni periodo di 60 giorni. Il controllo su Kraken usava le stesse candele con la stessa regola, quindi non era indipendente. Non è consulenza finanziaria.</p></details></div>
    <div class="scroll" style="margin-top:12px"><table>
      <thead><tr><th class="l">Crypto</th><th>Prezzo</th>${L.map(l => `<th class="l">${esc(l.nome)}</th>`).join('')}</tr></thead>
      <tbody>${items.map(({sym, x, s}) => `<tr><td class="l"><b>${esc(s.name)}</b> <span class="note">${esc(tk(sym))}</span></td><td>${f(x.prezzo)} €<br><span class="note">${hhmm(x.prezzo_ora || x.ora)}</span>${liveSpan(sym)}</td>${L.map(l => `<td class="l">${ordine(x, l.id)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note" style="margin-top:8px">${primo ? `Ordini validi fino alle ${hhmm(primo.fino)} (ora italiana): poi si rifanno, ogni ora piena, dall'ultima candela chiusa. ` : ''}I livelli valgono per i prezzi dell'ultimo aggiornamento: l'app si rigenera due volte al giorno, ma gli ordini si rifanno ogni ora in <code>live.py</code> e in <code>crypto_live.py</code>.</p>
    ${aperti.length ? `<p class="note" style="margin-top:8px"><b>Posizioni ancora aperte</b> (entrate scattate, protezione e obiettivo non ancora): ${aperti.map(({p, s}) => `${esc(s.name)}, ${nome(p.regola)}: entrato a ${f(p.prezzo_entrata)} €, protezione ${f(p.protezione)} €, obiettivo ${f(p.obiettivo)} €, fuori entro ${hhmm(p.scade)}`).join(' · ')}.</p>` : ''}
    <div class="alert" role="note" style="margin-top:12px"><div class="ic" aria-hidden="true">↻</div><p><b>Prezzi in diretta, con avvisi.</b> Dentro Claude un'app non può collegarsi alle borse. Sul tuo computer, nella cartella del progetto: <code>python3 live.py</code> apre questa app con i prezzi ogni 5 secondi e rifà gli ordini a ogni ora piena e il robot li esegue appena il prezzo li tocca (è un'esercitazione: in media perde); <code>python3 crypto_live.py</code> mostra i prezzi di Kraken ogni secondo, a che punto è ogni ordine e un avviso, anche con suono, a ogni entrata, protezione, obiettivo o scadenza. Serve solo Python 3; i prezzi sono pubblici e gratuiti.</p></div></div>`;
}

function intradayHTML() {
  const I = D.intraday; if (!I || !I.crypto) return '';
  const R = I.regole, V = I.verifica;
  const hhmm = s => { const d = new Date(s.replace(' UTC', 'Z').replace(' ', 'T')); return d.toLocaleString('it-IT', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome'}); };
  const f = x => nf(x, dec(x));
  const vtxt = s => s && s.n ? `${p100(s.p_gain)} in guadagno · media ${pc(s.media, 2)} · 1 su 10 sotto ${pc(s.p10, 1)}` : 'n/d';
  const nessuna = R.every(r => V[r.id].tutto.media < 0);
  const items = Object.entries(I.crypto).map(([sym, x]) => ({sym, x, s: SIM[sym]})).filter(o => o.s);
  const stato = p => ({dentro: `<span class="note">scattato${p.quando ? ' ' + hhmm(p.quando) : ''} a ${f(p.prezzo_entrata)} €</span><br>`,
    obiettivo: `<span class="note">già chiuso: obiettivo (${pc(p.rendimento, 1)})</span><br>`, protezione: `<span class="note">già chiuso: protezione (${pc(p.rendimento, 1)})</span><br>`,
    scaduto: '<span class="note">scaduto</span><br>', scaduto_dentro: '<span class="note">scaduto: si vende</span><br>'})[p.fase] || '';
  const aperti = items.flatMap(({x, s}) => (x.precedenti || []).filter(p => p.fase === 'dentro').map(p => ({p, s})));
  return `<div class="card" id="crypto-24"><h2>I due piani al giorno di prima</h2>
    <p class="sub" style="margin-top:4px">Due piani per ogni crypto, validi 24 ore dall'ultimo aggiornamento, e com'è andata la stessa regola negli ultimi 2 anni (piani rifatti ogni giorno alle 18 e alle 22 ora italiana, 12 crypto, costi 0,2 % per operazione). Sono stati sostituiti dagli ordini di ogni ora, qui sopra, che però perdono anch'essi: il robot usa solo gli ordini di ogni ora.</p>
    <div class="scroll" style="margin-top:10px"><table>

/* ---------------- la probabilità di guadagno: la rete sceglie le operazioni che chiudono in guadagno? ---------------- */
function probHTML(c0, esperienza, unita) {
  const P = c0 && c0.probabilita, T = c0 && c0.tutte; if (!P || !T) return '';
  const cal = (c0.calibrazione || []).filter(f => f.n), sc = c0.scelte_probabilita || [], via = sc.filter(s => !s.fuori).length;
  const meglio = P.n >= 20 && P.vinte > T.vinte + 0.03 && P.media > T.media, guadagna = meglio && P.media > 0;
  const quanti = P.sedute ? `${P.sedute} sedute` : `${P.giorni} giorni`;
  const fasce = cal.map(f => `<tr><td class="l">${nf(f.da * 100, 0)}–${nf(f.a * 100, 0)} %</td><td>${f.n.toLocaleString('it-IT')}</td><td>${p100(f.stimata)}</td><td class="${f.vinte >= f.stimata - 0.02 ? 'pos' : 'neg'}"><b>${p100(f.vinte)}</b></td><td class="${f.media >= 0 ? 'pos' : 'neg'}">${pc(f.media, 2)}</td></tr>`).join('');
  const quote = (c0.per_quota || []).map(q => `<tr><td class="l">il meglio ${nf(q.quota * 100, q.quota < 0.01 ? 1 : 0)} %</td><td>${q.n}</td><td>${q.n ? p100(q.vinte) : '–'}</td><td class="${q.media >= 0 ? 'pos' : 'neg'}">${q.n ? pc(q.media, 2) : '–'}</td><td class="${q.totale >= 0 ? 'pos' : 'neg'}">${pc(q.totale, 2)}</td></tr>`).join('');
  const diario = (esperienza || []).slice(-8).reverse().map(r => `<tr><td class="l">${esc(r.data)}</td><td>${r.dati}</td><td>${p100(r.soglia)}</td><td>${nf(r.quota * 100, r.quota < 0.01 ? 1 : 0)} %</td><td>${r.memoria ? 'ultimi ' + nf(r.memoria, 0) + ' giorni' : 'tutto il passato'}</td><td>${r.n}</td><td>${p100(r.vinte)}</td><td class="${r.media >= 0 ? 'pos' : 'neg'}">${pc(r.media, 2)}</td><td>${r.fuori ? 'no' : 'sì'}</td></tr>`).join('');
  return `<h3 style="margin-top:16px">La rete sceglie le operazioni che chiudono in guadagno?</h3>
    <p class="note" style="margin-top:2px">Una seconda rete impara da tutte le operazioni possibili del passato, e dal loro esito, la <b>probabilità che un'operazione chiuda in guadagno</b> dopo i costi. È quella che usa il robot: compra solo le occasioni con la probabilità più alta, e la soglia la sceglie la rete sul periodo più recente (quante delle occasioni migliori prendere: quella con la media per operazione più alta). Sceglie anche la sua <b>memoria</b>: se imparare da tutto il passato o dare più peso agli ultimi mesi o settimane, prendendo quella che prevede meglio il periodo più recente. Ogni sera si riaddestra con i dati nuovi.</p>
    <div class="verdetto ${guadagna ? 'v-si' : 'v-no'}" style="margin-top:8px"><div class="vh"><span class="vi" aria-hidden="true">${guadagna ? '✓' : '✕'}</span><div><b>${guadagna ? 'Sceglie meglio del caso e chiude in guadagno' : meglio ? 'Sceglie meglio del caso, ma dopo i costi perde ancora' : 'Per ora non sa distinguere le operazioni vincenti'}</b><p>Su ${quanti} mai ${P.sedute ? 'viste' : 'visti'} in addestramento, le operazioni scelte così sono state ${P.n}: in guadagno il <b>${P.n ? p100(P.vinte) : '–'}</b>, in media ${P.n ? pc(P.media, 2) : '–'} ciascuna. Tutte le occasioni, senza scegliere: in guadagno il ${p100(T.vinte)}, in media ${pc(T.media, 2)}. La soglia ha avuto il via libera della verifica in ${via} finestre su ${sc.length}.${meglio ? ' Con pochi dati può essere il caso: conta come va nei prossimi mesi.' : ' Il robot la usa lo stesso, perché tu possa vederla imparare.'}</p></div></div></div>
    <p class="note" style="margin-top:8px"><b>Quello che stima e quello che succede</b> (tutte le occasioni dei periodi mai visti, all'orizzonte che la rete preferisce). Se la rete sapesse scegliere, nelle fasce alte si vincerebbe più spesso.</p>
    <div class="scroll" style="margin-top:4px"><table><thead><tr><th class="l">Probabilità stimata</th><th>Occasioni</th><th>Stimata in media</th><th>Vinte davvero</th><th>Media</th></tr></thead><tbody>${fasce}</tbody></table></div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr><th class="l">Prendere solo…</th><th>Operazioni</th><th>In guadagno</th><th>Media</th><th>Conto</th></tr></thead><tbody>${quote}</tbody></table></div>
    <p class="note" style="margin-top:4px">"Il meglio 1 %": le occasioni con la probabilità stimata più alta, con la soglia presa dal periodo di scelta e una posizione alla volta per ${unita}.</p>
    ${diario ? `<p class="note" style="margin-top:8px"><b>Diario degli addestramenti</b>: cosa ha scelto la rete ogni volta che ha imparato (nel periodo di scelta, prima del test).</p>
    <div class="scroll" style="margin-top:4px"><table><thead><tr><th class="l">Data</th><th>${unita === 'titolo' ? 'Sedute' : 'Giorni'} di dati</th><th>Soglia</th><th>Prende il meglio</th><th>Memoria</th><th>Operazioni</th><th>In guadagno</th><th>Media</th><th>Via libera</th></tr></thead><tbody>${diario}</tbody></table></div>` : ''}`;
}

    <p>Per ogni titolo usa fino a <b>25 anni</b> di prezzi giornalieri. <b>Com'è andata davvero</b>: su tutte le finestre reali della storia (ogni giorno, ogni settimana, ogni mese, ogni anno), quante volte il prezzo è salito. <b>Macchina del Tempo</b>: 10.000 futuri fatti di pezzi veri della storia; per 1 anno incolla 12 mesi veri presi a caso, così ottiene 10.000 anni possibili invece dei pochi reali. La crescita di fondo viene tolta e rimessa secondo tre scenari: <b>nessuna crescita</b>, <b>prudente</b> (la crescita passata ridotta: le vere differenze di crescita attesa tra grandi titoli sono di pochi punti l'anno, il resto è soprattutto fortuna) e <b>come in passato</b>.</p>

  const quando = t ? t.toLocaleString('it-IT', vecchio ? {weekday: 'short', hour: '2-digit', minute: '2-digit'} : {hour: '2-digit', minute: '2-digit'}) : '';
  return `<span class="lvd${vecchio ? ' off' : ''}" aria-hidden="true"></span>${vecchio ? 'ultimo prezzo' : 'ora'} <b>${cmoney(q.p, cur)}</b>${ch != null ? ` <span class="${ch >= 0 ? 'pos' : 'neg'}">${pc(ch, 2)}</span>` : ''}${quando ? ' · ' + quando : ''}${q.ritardo && !vecchio ? ` <span class="note">(${q.ritardo} min di ritardo)</span>` : ''}`;

function livelloHTML(el) {
  const q = LIVE.q[el.dataset.livello], liv = Number(el.dataset.liv); if (!q || !q.p || !q.t) return '';
  const giorno = new Date(q.t * 1000).toISOString().slice(0, 10); if (giorno <= el.dataset.dal) return '';   // seduta non ancora iniziata

  return sotto ? '<span class="neg">adesso sotto il livello</span>' : toccato ? '<span class="pos">oggi è sceso al livello ed è risalito</span>' : '<span class="note">oggi sempre sopra il livello</span>';
}
function mostraLive() {
  document.querySelectorAll('[data-live]').forEach(e => { const h = quotaHTML(e.dataset.live); if (e.innerHTML !== h) e.innerHTML = h; });
  document.querySelectorAll('[data-livello]').forEach(e => { const h = livelloHTML(e); if (e.innerHTML !== h) e.innerHTML = h; });

  if (LIVE.fonte) h = LIVE.errore ? `<span class="lvd err"></span>tempo reale: ${esc(LIVE.errore.testo)}` : `<span class="lvd"></span>in tempo reale${ora ? ' · ' + ora : ''}`;
  else if (LIVE.disponibile) h = `<button type="button" class="lvbtn" id="live-on">${LIVE.occupato ? 'Collego…' : 'Prezzi in tempo reale'}</button>${LIVE.errore ? ` <span class="neg">${esc(LIVE.errore.testo)}</span>` : ''}`;
  else h = `<button type="button" class="linkb" id="live-come">tempo reale?</button>`;

async function avviaLive() {
  const info = $('#live-info'); if (info) { info.innerHTML = liveInfoHTML(); $('#live-chiudi').addEventListener('click', () => { info.hidden = true; }); }
  if (!window.claude && /^https?:$/.test(location.protocol)) {                    // servita da live.py
    try { const r = await fetch('/quotazioni?s=EURUSD%3DX', {cache: 'no-store'}); if (r.ok && (await r.json()).quote) LIVE.fonte = 'locale'; } catch (e) {}
    if (LIVE.fonte === 'locale') {
      if (MOTORE_PAGINA) { const batti = () => fetch('/robot/battito', {method: 'POST'}).catch(() => {}); batti(); setInterval(batti, 20e3); setInterval(sincronizzaRobot, 10e3); }
      else {
        try { const r = await fetch('/robot/info', {cache: 'no-store'}); SPETTATORE = r.ok && (await r.json()).motore; } catch (e) {}

      }
    }

      try {
        const r = await fetch('/robot', {cache: 'no-store'});

    try {
      const mcp = await claude.use('mcp');
      if (mcp) { const L = await mcp.listTools(BROWSER).catch(() => null); if (L && (L.servers || []).some(x => x.server === BROWSER)) { LIVE.mcp = mcp; LIVE.disponibile = true; } }
    } catch (e) {}
  }
  mostraLive();
  if (LIVE.fonte) giroLive();
  let giri = 0;
  setInterval(() => {
    mostraLive();
    giri++;
    if (giri % 30 === 0) robotGiro();
    if (giri % 60 === 1) robotAperture();
    if (giri % 15 === 3) robotOrdini();
    if (!LIVE.fonte || document.hidden) return;
    if (Date.now() - LIVE.ultimo >= (LIVE.fonte === 'locale' ? 5000 : 30000)) giroLive();
  }, 1000);
}
