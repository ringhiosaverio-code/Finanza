<meta charset="utf-8">
<title>Finanza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra fissa con le sezioni; una colonna da 1040px; una scheda per titolo con tre blocchi (compra, vendi, quante) che si impilano su telefono */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--surface2:#edf0f5;--ink:#10151d;--ink2:#465062;--muted:#737d8f;--line:#e0e4eb;
  --accent:#2453c9;--accent-ink:#ffffff;--accent-soft:#e7eefc;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#6250d6;
  --good:#0ca30c;--crit:#d03b3b;--warn:#fab219;--neutral:#c3c2b7;
  --good-ink:#0a7a0a;--crit-ink:#b42c2c;--warn-soft:#fff6de;--good-soft:#e8f6e8;--crit-soft:#fbeaea;
  --band-out:#d3e5fb;--band-in:#8db9ef;--median:#184f95;
  --shadow:0 1px 2px rgba(16,21,29,.05),0 4px 16px rgba(16,21,29,.04);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0d1015;--surface:#151920;--surface2:#1c212a;--ink:#eef0f3;--ink2:#b5bcc8;--muted:#818b9a;--line:#262c37;
  --accent:#6f95f2;--accent-ink:#0d1015;--accent-soft:#1b2640;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--neutral:#55575c;
  --good-ink:#35c435;--crit-ink:#f07272;--warn-soft:#2c2414;--good-soft:#14281a;--crit-soft:#301a1a;
  --band-out:#123a6b;--band-in:#1f5fae;--median:#c4dcf8;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0d1015;--surface:#151920;--surface2:#1c212a;--ink:#eef0f3;--ink2:#b5bcc8;--muted:#818b9a;--line:#262c37;
  --accent:#6f95f2;--accent-ink:#0d1015;--accent-soft:#1b2640;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#9085e9;--neutral:#55575c;
  --good-ink:#35c435;--crit-ink:#f07272;--warn-soft:#2c2414;--good-soft:#14281a;--crit-soft:#301a1a;
  --band-out:#123a6b;--band-in:#1f5fae;--median:#c4dcf8;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-head);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.2}h2{font-size:20px}h3{font-size:16px}h4{font-size:14px}
p{margin:0}
.sub{color:var(--ink2)}
.note{color:var(--muted);font-size:13px}
.pos{color:var(--good-ink)}.neg{color:var(--crit-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0}
.brand b{font-family:var(--f-head);font-size:21px;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:9px 12px 10px;color:var(--ink2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.view > *{min-width:0}

/* blocchi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card > h2 + .sub,.card > h3 + .sub{margin-top:4px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.alert .ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#10151d;display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.alert p{font-size:14px;color:var(--ink2)}
.alert b{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps b{color:var(--ink)}
ol.steps{margin:0;padding:0}

/* scelta della regola */
.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts.h{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.s{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .n{font-weight:600}
.opt .d{font-size:12.5px;color:var(--ink2)}
.opt .p{font-family:var(--f-head);font-weight:600;font-size:18px;margin-top:4px}
.opt .p small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.choose{display:grid;gap:16px}
.outcome{border-radius:12px;background:var(--surface2);padding:12px 14px;font-size:14.5px;color:var(--ink2)}
.outcome b{color:var(--ink)}
.acct{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.acct .f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.acct input{width:130px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}

/* scheda titolo */
.picks{display:grid;gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px;min-width:0}
.pick .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick .rk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.pick .id{flex:1 1 160px;min-width:0}
.pick .tk{font-family:var(--f-head);font-weight:700;font-size:20px;margin-right:8px}
.pick .nm{color:var(--ink2);font-size:13.5px}
.pick .pr{display:flex;align-items:center;gap:10px}
.pick .pv{font-family:var(--f-head);font-weight:700;font-size:26px;line-height:1}
.pick .pl{font-size:12px;color:var(--muted);line-height:1.3}
.meter{position:relative;width:96px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:4px}
.meter::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--muted)}
.trio{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.trio > div{border-radius:12px;padding:10px 12px;background:var(--surface2);min-width:0}
.trio .k{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.trio .big{font-family:var(--f-head);font-weight:600;font-size:18px}
.trio small{display:block;color:var(--ink2);font-size:12.5px}
.trio .sell{display:grid;gap:2px;font-size:14px}
.why{font-size:14px;color:var(--ink2)}
.why b{color:var(--ink)}
.more{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.more[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
.more-body{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.two > *{min-width:0}
.entry-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.entry-in input{width:110px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit}
.bar{display:flex;gap:2px;height:14px}
.bar i{display:block;height:100%;border-radius:3px;min-width:2px}
.oc{display:grid;gap:12px;margin-top:10px}
.oc .r{display:grid;grid-template-columns:minmax(110px,160px) 1fr 64px;gap:10px;align-items:center}
.oc .r .t{font-size:13px;color:var(--ink2)}
.oc .r .t small{display:block;color:var(--muted);font-size:11.5px}
.oc .r .g{font-family:var(--f-head);font-weight:600;font-size:18px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;border-radius:1px;vertical-align:3px}
.legend i.dash{height:0;border-top:2px dashed currentColor;background:none;vertical-align:3px}

/* grafici */
.chart{position:relative;margin-top:8px;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);display:none;white-space:nowrap;z-index:3}
.tip .t{font-weight:600;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.tip .r span:last-child{color:var(--ink)}

/* verifica: confronto delle regole */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:12px}
.rg h4{margin-bottom:6px;color:var(--ink2)}
.rb{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left}
.rb:hover{background:var(--surface2)}
.rb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rb .rn{font-size:13.5px}
.rb .rv{font-weight:600;text-align:right}
.rb .rx{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.track{position:relative;height:10px;border-radius:5px;background:var(--surface2)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--s1)}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--ink2)}
.stat .v{font-family:var(--f-head);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat .d{font-size:12px;color:var(--muted)}
.ctlrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tabelle */
.scroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
details > summary{cursor:pointer;color:var(--ink2);font-size:14px}
details[open] > summary{margin-bottom:10px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty code{background:var(--surface2);padding:2px 6px;border-radius:6px}
.prose{max-width:68ch;display:grid;gap:10px;color:var(--ink2)}
.prose b{color:var(--ink)}
.prose h3{color:var(--ink);margin-top:8px}
footer{color:var(--muted);font-size:12.5px}

/* simula */
.simf{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.simf > *{min-width:0}
.simrow{display:flex;gap:8px}
.simrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:17px;letter-spacing:.03em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px}
.simrow input:focus{border-color:var(--accent);outline:none}
.go{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 20px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chipb:hover{border-color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--ink2);justify-self:start;background:var(--surface)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.alta::before{background:var(--good)}.chip.media::before{background:var(--warn)}.chip.bassa::before{background:var(--crit)}
.simres{display:grid;gap:16px}
.simres > *{min-width:0}
.simhd{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:flex-start}
.simhd .last{display:grid;text-align:right}
.simhd .last .k{font-size:12px;color:var(--muted)}
.simhd .last b{font-family:var(--f-head);font-size:22px}
.simhd .last small{color:var(--muted);font-size:12px}
.hz{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.hzc{background:var(--surface2);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.hzc .k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hzc .pr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.hzc .pv{font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1;white-space:nowrap}
.hzc .pl{font-size:12px;color:var(--muted);line-height:1.3}
.hzc small{color:var(--ink2);font-size:12.5px}
.hzc small.note{color:var(--muted)}
.hzc .meter{width:100%}
.ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ask code{background:var(--surface2);padding:6px 10px;border-radius:8px;font-size:14px;user-select:all}

/* giudizio */
.verdetto{border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:12px;padding:12px 16px;background:var(--surface);display:grid;gap:10px}
.verdetto.v-si{--vc:var(--good)}.verdetto.v-cautela{--vc:var(--warn)}.verdetto.v-no{--vc:var(--crit)}
.verdetto .vh{display:flex;gap:12px;align-items:flex-start}
.verdetto .vi{flex:none;width:26px;height:26px;border-radius:50%;background:var(--vc);color:#fff;display:grid;place-items:center;font-weight:700}
.verdetto.v-cautela .vi{color:#10151d}
.verdetto .vh b{font-family:var(--f-head);font-size:17px}
.verdetto .vh p{color:var(--ink2);font-size:14px}
.vcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px 20px}
.vcols > *{min-width:0}
.vcols h4{font-size:13px;color:var(--ink2);margin-bottom:4px}
.vcols ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink2)}
.vcols b{color:var(--ink)}
.verdetto details > summary{font-size:13.5px}
.verdetto details[open] > summary{margin-bottom:8px}

/* portafoglio, demo, crypto, altro */
.act{flex:none;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.04em;border-radius:10px;padding:6px 12px;color:#fff;background:var(--ac,var(--muted))}
.act-si .act,.act-mini{--ac:var(--good)}.act-no .act{--ac:var(--crit)}.act-cautela .act{--ac:var(--s1)}
.act-mini{font-size:11.5px;padding:3px 8px;border-radius:7px;color:#fff;background:var(--good);font-weight:700;letter-spacing:.04em}
.pick.act-no{border-left:5px solid var(--crit)}.pick.act-si{border-left:5px solid var(--good)}.pick.act-cautela{border-left:5px solid var(--s1)}
.row-buy{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row-buy .pv-mini{font-family:var(--f-head);font-weight:700;margin-left:auto}
.linkb{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface2)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.lk{display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.lk span{color:var(--ink2);font-size:14px}
.lk:hover{border-color:var(--accent)}

/* oggi */
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.cat::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cc)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}

@media (max-width:760px){
  .opts.s{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hz{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hzc .pv{font-size:26px}
  .hzc{padding:10px 12px}
  .simhd .last{text-align:left}
  .trio{grid-template-columns:1fr}
  .oc .r{grid-template-columns:1fr 60px}
  .oc .r .t{grid-column:1/-1}
  h1{font-size:24px}
}
@media (max-width:420px){.opts.h .opt .d{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Finanza</b><span id="meta"></span></div>
    <nav class="tabs" aria-label="Sezioni">
      <a href="#oggi" data-v="oggi">Oggi</a>
      <a href="#portafoglio" data-v="portafoglio">Il mio portafoglio</a>
      <a href="#demo" data-v="demo">Esercitati</a>
      <a href="#crypto" data-v="crypto">Crypto</a>
      <a href="#simula" data-v="simula">Cerca un titolo</a>
      <a href="#altro" data-v="altro">Altro</a>
    </nav>
  </div>
</header>

<main class="wrap">

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
let mkt = D.mercati.usa ? 'usa' : 'italia';
let S = D.mercati[mkt];
function setMkt(m) { if (D.mercati[m]) { mkt = m; S = D.mercati[m]; } }
const $ = (s, r = document) => r.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const nf = (x, d = 2) => Number(x).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
const pc = (x, d = 1, sign = true) => { if (x == null) return 'n/d'; let v = x * 100; if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0; return (sign && v > 0 ? '+' : '') + nf(v, d) + ' %'; };
const p100 = x => x == null ? 'n/d' : Math.round(x * 100) + ' %';
const usd = x => x == null ? '–' : nf(x, 2) + ' $';
const money = x => x == null ? '–' : nf(x, Math.abs(x) < 10 ? 3 : 2) + ' ' + S.mercato.valuta;
const tk = s => String(s).replace(/\.MI$|-EUR$/, '');
const dt = (s, o) => new Date(s + 'T12:00:00Z').toLocaleDateString('it-IT', Object.assign({timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short'}, o || {}));
const dtl = s => dt(s, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------------- stato (ricordato solo in questo browser) ---------------- */
const DEF = S.rules.default;
const st = Object.assign({style: DEF.style, hold: DEF.hold, cap: 10000, risk: 100, maxpct: 15, trend: false, open: {}, entry: {}, vmkt: null}, load());
st.open = {}; st.entry = {};
function load() { try { const x = JSON.parse(localStorage.getItem('finanza-app-v3') || '{}'); return x && typeof x === 'object' ? x : {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem('finanza-app-v3', JSON.stringify({style: st.style, hold: st.hold, cap: st.cap, risk: st.risk, maxpct: st.maxpct, trend: st.trend})); } catch (e) {} }
const key = (s = st.style, h = st.hold) => `${s}|${h}`;
const model = (s, h) => S.models[key(s, h)];
const styleOf = id => S.rules.styles.find(s => s.id === id);
const holdName = h => S.rules.hold_names[h];
const prob = c => model().p[c.g];
const GROUP_NAMES = ['tra i più deboli', 'sotto la media', 'nella media', 'sopra la media', 'tra i più forti'];
const GROUP_SHORT = ['Più deboli', 'Sotto media', 'Nella media', 'Sopra media', 'Più forti'];
if (!S.rules.styles.some(s => s.id === st.style)) st.style = DEF.style;
if (!S.rules.holds.includes(st.hold)) st.hold = DEF.hold;

/* ---------------- sezioni ---------------- */
const VIEWS = ['oggi', 'portafoglio', 'demo', 'crypto', 'simula', 'altro', 'consigli', 'italia', 'verifica', 'daytrade', 'metodo'];
let view = null;
function route() {
  let v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'oggi';
  if (v === 'italia' && !D.mercati.italia) v = 'consigli';
  if (v === 'consigli' && !D.mercati.usa) v = 'italia';
  view = v;
  const sec = v === 'italia' ? 'consigli' : v;
  ['oggi', 'portafoglio', 'demo', 'crypto', 'altro', 'consigli', 'simula', 'verifica', 'daytrade', 'metodo'].forEach(x => { $('#v-' + x).hidden = x !== sec; });
  const navv = ['consigli', 'italia', 'verifica', 'daytrade', 'metodo'].includes(v) ? 'altro' : v;
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === navv ? 'page' : 'false'));
  if (sec === 'consigli') { setMkt(v === 'italia' ? 'italia' : 'usa'); st.vmkt = mkt; renderConsigli(); }
  else if (sec === 'verifica') { setMkt(st.vmkt || mkt); renderVerifica(); }
  else if (sec === 'oggi') renderOggi();
  else if (sec === 'portafoglio') renderPortafoglio();
  else if (sec === 'demo') renderDemo();
  else if (sec === 'crypto') renderCrypto();
  else if (sec === 'altro') renderAltro();
  else if (sec === 'simula') renderSimula();
  else if (sec === 'daytrade') renderDay();
  else renderMetodo();
  $('#meta').textContent = !['consigli', 'verifica'].includes(sec) ? (D.aggiornato ? `Aggiornato ${dt(D.aggiornato.slice(0, 10))}, ${D.aggiornato.slice(11, 16)}` : '') : `Dati alla chiusura di ${dt(S.asof, {year: 'numeric'})} · ${S.mercato.nome}`;
}
function redraw() { const sec = view === 'italia' ? 'consigli' : view; draw[sec] && draw[sec](); }
window.addEventListener('hashchange', route);

/* ---------------- grafici ---------------- */
const NS = 'http://www.w3.org/2000/svg';
function el(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function text(p, x, y, s, o) { const t = el('text', Object.assign({x, y, 'font-size': 11, fill: css('--muted')}, o || {}), p); t.textContent = s; return t; }
function halo(p, x, y, s, o) { return text(p, x, y, s, Object.assign({'font-size': 12, 'font-weight': 600, fill: css('--ink'), stroke: css('--surface'), 'stroke-width': 4, 'paint-order': 'stroke', 'stroke-linejoin': 'round', 'text-anchor': 'end'}, o || {})); }
function tip(box, h, x, y) { const t = box.querySelector('.tip'); t.innerHTML = h; t.style.display = 'block'; const w = t.offsetWidth, W = box.clientWidth; t.style.left = Math.max(0, Math.min(W - w, x + 14)) + 'px'; t.style.top = Math.max(0, y - 12) + 'px'; }
function untip(box) { const t = box.querySelector('.tip'); if (t) t.style.display = 'none'; }
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= raw) return k * p; return 10 * p; }
function frame(box, H, label) { box.querySelector('svg')?.remove(); const W = box.clientWidth || 600; const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': label}); box.prepend(svg); return [svg, W]; }
function yGrid(svg, m, W, y, lo, hi, fmt) {
  const step = niceStep((hi - lo) / 5);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css('--line'), 'stroke-width': 1}, svg);
    text(svg, m.l - 8, y(v) + 4, fmt(v, step), {'text-anchor': 'end'});
  }
}
function xLabels(svg, n, x, H, lab, every, minGap) {
  const idx = []; for (let i = 0; i < n; i++) if (every(i)) idx.push(i);
  const end = idx[idx.length - 1] === n - 1; let last = -1e9;
  idx.forEach(i => {
    if (x(i) - last < minGap) return;
    if (end && i !== n - 1 && x(n - 1) - x(i) < minGap) return;
    text(svg, x(i), H - 8, lab(i), {'text-anchor': i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}); last = x(i);
  });
}
function crosshair(svg, box, m, W, H, n, x, onIdx) {
  const cross = el('line', {y1: m.t, y2: H - m.b, stroke: css('--muted'), 'stroke-width': 1, visibility: 'hidden', 'stroke-dasharray': '2 3'}, svg);
  const hit = el('rect', {x: m.l, y: m.t, width: Math.max(0, W - m.l - m.r), height: Math.max(0, H - m.t - m.b), fill: 'transparent'}, svg);
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    const h = onIdx(i, true); tip(box, h, x(i) * r.width / W, ev.clientY - r.top);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); onIdx(-1, false); untip(box); });
}
const swatch = c => `<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:6px"></i>`;

/* Grafico del prezzo: chiusure, media a 200 giorni, livelli della regola */
function priceChart(box, p, lv) {
  const H = Math.max(230, Math.min(320, (box.clientWidth || 600) * 0.42));
  const [svg, W] = frame(box, H, 'Prezzo di ' + tk(p.symbol) + ' negli ultimi 6 mesi');
  const m = {l: 52, r: 10, t: 14, b: 26}, C = p.chart, n = C.close.length;
  const vals = C.close.concat(C.sma.filter(v => v != null), [lv.limit, lv.stop, lv.target].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / (n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => dt(C.dates[i], {weekday: undefined, day: undefined, month: 'short'}), i => i === 0 || C.dates[i].slice(5, 7) !== C.dates[i - 1].slice(5, 7), W < 520 ? 52 : 40);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);
  const path = arr => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; }); return d; };
  el('path', {d: path(C.sma), fill: 'none', stroke: css('--muted'), 'stroke-width': 1.5, 'stroke-dasharray': '5 4'}, svg);
  el('path', {d: path(C.close), fill: 'none', stroke: css('--s1'), 'stroke-width': 2, 'stroke-linejoin': 'round'}, svg);
  const lines = [[lv.target, 'Obiettivo ' + nf(lv.target), '--good', ''], [lv.limit, 'Prezzo max ' + nf(lv.limit), '--accent', '4 4'], [lv.stop, 'Protezione ' + nf(lv.stop), '--crit', '']].filter(a => a[0] != null);
  lines.forEach(([v, lab, c, dash], k) => {
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css(c), 'stroke-width': 1.5, 'stroke-dasharray': dash}, svg);
    halo(svg, m.l + 6, (lab.startsWith('Protezione') ? y(v) + 15 : y(v) - 6), lab, {'text-anchor': 'start'});
  });
  const dot = el('circle', {r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg);
  el('circle', {cx: x(n - 1), cy: y(C.close[n - 1]), r: 4, fill: css('--s1'), stroke: css('--surface'), 'stroke-width': 2}, svg);
  crosshair(svg, box, m, W, H, n, x, (i, on) => {
    if (!on) { dot.setAttribute('visibility', 'hidden'); return ''; }
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(C.close[i])); dot.setAttribute('visibility', 'visible');
    return `<div class="t">${dt(C.dates[i], {year: 'numeric'})}</div><div class="r"><span>${swatch(css('--s1'))}Chiusura</span><span>${money(C.close[i])}</span></div>` +
      (C.sma[i] != null ? `<div class="r"><span>Media 200 giorni</span><span>${money(C.sma[i])}</span></div>` : '');
  });
}

/* Ventaglio: percentili 5/25/50/75/95 per ogni passo, con i livelli */
function fanChart(box, bands, labels, lv, label, timeFmt) {
  const H = Math.max(230, Math.min(330, (box.clientWidth || 600) * 0.44));
  const [svg, W] = frame(box, H, label);
  const m = {l: 52, r: 10, t: 16, b: 26}, n = bands.length;
  const vals = bands.flatMap(b => [b[0], b[4]]).concat([lv.stop, lv.target, lv.entry].filter(v => v != null && isFinite(v)));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => labels[i], timeFmt.every, W < 520 ? 60 : 44);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);
  const area = (a, b) => 'M' + bands.map((r, i) => x(i) + ',' + y(r[a])).join('L') + 'L' + bands.map((r, i) => [i, r]).reverse().map(([i, r]) => x(i) + ',' + y(r[b])).join('L') + 'Z';
  el('path', {d: area(0, 4), fill: css('--band-out')}, svg);
  el('path', {d: area(1, 3), fill: css('--band-in')}, svg);
  el('path', {d: 'M' + bands.map((r, i) => x(i) + ',' + y(r[2])).join('L'), fill: 'none', stroke: css('--median'), 'stroke-width': 2, 'stroke-linejoin': 'round'}, svg);
  [[lv.target, 'Obiettivo ', '--good', ''], [lv.entry, lv.entryLabel || 'Entrata ', '--muted', '4 4'], [lv.stop, 'Protezione ', '--crit', '']].forEach(([v, lab, c, dash]) => {
    if (v == null || !isFinite(v)) return;
    el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css(c), 'stroke-width': 2, 'stroke-dasharray': dash}, svg);
    halo(svg, W - m.r, lab === 'Protezione ' ? y(v) + 15 : y(v) - 6, lab + nf(v));
  });
  const dot = el('circle', {r: 4.5, fill: css('--median'), stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden'}, svg);
  crosshair(svg, box, m, W, H, n, x, (i, on) => {
    if (!on) { dot.setAttribute('visibility', 'hidden'); return ''; }
    const b = bands[i]; dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(b[2])); dot.setAttribute('visibility', 'visible');
    return `<div class="t">${timeFmt.tip(i)}</div>` + [['1 caso su 20 sopra', b[4]], ['1 su 4 sopra', b[3]], ['Caso centrale', b[2]], ['1 su 4 sotto', b[1]], ['1 su 20 sotto', b[0]]].map(([k, v]) => `<div class="r"><span>${k}</span><span>${nf(v)}</span></div>`).join('');
  });
}



/* Barre degli esiti (obiettivo / data / protezione) in HTML */
function outcomeRow(label, small, s) {
  if (!s || !s.n) return `<div class="r"><div class="t">${label}<small>${small}</small></div><div class="note">Nessun caso</div><div class="g">n/d</div></div>`;
  const sg = (p, c, t) => p > 0 ? `<i style="width:${(p * 100).toFixed(1)}%;background:var(${c})" title="${t}: ${p100(p)}"></i>` : '';
  return `<div class="r"><div class="t">${label}<small>${small}</small></div>
    <div><div class="bar" role="img" aria-label="obiettivo ${p100(s.p_target)}, alla data ${p100(s.p_tempo)}, protezione ${p100(s.p_stop)}">${sg(s.p_target, '--good', 'Obiettivo raggiunto')}${sg(s.p_tempo, '--neutral', 'Venduto alla data')}${sg(s.p_stop, '--crit', 'Protezione scattata')}</div>
    <div class="note" style="margin-top:3px">di solito ${pc(s.median)} · 1 volta su 10 sotto ${pc(s.p10, 0)}, 1 su 10 sopra ${pc(s.p90, 0)}</div></div>
    <div class="g" title="In guadagno">${p100(s.p_gain)}</div></div>`;
}
const ocLegend = `<div class="legend"><span><i style="background:var(--good)"></i>Obiettivo raggiunto</span><span><i style="background:var(--neutral)"></i>Venduto alla data</span><span><i style="background:var(--crit)"></i>Protezione scattata</span><span>A destra: quante volte in guadagno</span></div>`;

/* ---------------- simulazione nel browser (Macchina del Tempo) ---------------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mcCache = {};
function timeMachine(c, lv, trend) {
  const ck = [mkt, c.symbol, key(), lv.entry.toFixed(4), trend].join('/');
  if (mcCache[ck]) return mcCache[ck];
  const B = S.details[c.symbol].bars, nb = B.length, hold = st.hold, N = 10000, rand = rng(19);
  let adj = 1;
  if (!trend) { let mu = 0; for (const b of B) mu += Math.log(b[3]); adj = Math.exp(-mu / nb); }
  const stop = lv.stop == null ? -Infinity : lv.stop, target = lv.target == null ? Infinity : lv.target, entry = lv.entry;
  const closes = Array.from({length: hold}, () => new Float64Array(N));
  const rets = new Float64Array(N); let nT = 0, nS = 0, nD = 0;
  for (let n = 0; n < N; n++) {
    let prev = entry, done = false, ret = 0;
    for (let d = 0; d < hold; d++) {
      const b = B[(rand() * nb) | 0];
      const o = prev * b[0] * adj, h = prev * b[1] * adj, l = prev * b[2] * adj, cl = prev * b[3] * adj;
      closes[d][n] = cl;
      if (!done) {
        if (d > 0 && o <= stop) { done = true; ret = o / entry - 1; nS++; }
        else if (d > 0 && o >= target) { done = true; ret = o / entry - 1; nT++; }
        else if (l <= stop) { done = true; ret = stop / entry - 1; nS++; }
        else if (h >= target) { done = true; ret = target / entry - 1; nT++; }
        else if (d === hold - 1) { done = true; ret = cl / entry - 1; nD++; }
      }
      prev = cl;
    }
    rets[n] = ret - S.costo;
  }
  const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(f * (arr.length - 1)))];
  const bands = [[entry, entry, entry, entry, entry]];
  for (const cl of closes) { cl.sort(); bands.push([q(cl, .05), q(cl, .25), q(cl, .5), q(cl, .75), q(cl, .95)]); }
  const r = rets.slice().sort(); let g = 0; for (const v of rets) if (v > 0) g++;
  return (mcCache[ck] = {n: N, p_target: nT / N, p_stop: nS / N, p_tempo: nD / N, p_gain: g / N, median: q(r, .5), p10: q(r, .1), p90: q(r, .9), bands});
}

/* ---------------- titoli consigliati ---------------- */
function levels(c, entry) {
  const sty = styleOf(st.style), a = c.atr;
  return {entry, limit: c.price + S.rules.limit_atr * a, stop: sty.ks ? entry - sty.ks * a : null,
          target: sty.ks && sty.rr ? entry + sty.rr * sty.ks * a : null, entryDay: S.future_days[0], exitDay: S.future_days[st.hold - 1]};
}
function sizing(lv) {
  const byCap = Math.floor(st.cap * st.maxpct / 100 / lv.entry);
  const byRisk = lv.stop != null ? Math.floor(st.risk / (lv.entry - lv.stop)) : Infinity;
  const sh = Math.max(0, Math.min(byCap, byRisk));
  return {sh, amount: sh * lv.entry, loss: lv.stop != null ? sh * (lv.entry - lv.stop) : null};
}
function ranked() { return S.candidates.slice().sort((a, b) => prob(b) - prob(a) || b.forza - a.forza); }
function whyText(c) {
  const i = c.info, parts = [];
  parts.push(`<b>${pc(i.anno, 0)}</b> nell'ultimo anno, forza ${GROUP_NAMES[c.g]} dei candidati`);
  parts.push(i.dal_massimo > -0.02 ? 'quasi al massimo dell’anno' : `${pc(-i.dal_massimo, 0, false)} sotto il massimo dell’anno`);
  parts.push(`${pc(i.sopra_media, 0, false)} sopra la media a 200 giorni`);
  parts.push(`oscilla in media del ${pc(c.atr / c.price, 1, false)} al giorno`);
  return parts.join(' · ');
}
function optHold() {
  return S.rules.holds.map(h => { const m = model(st.style, h);
    return `<button type="button" class="opt" data-h="${h}" aria-pressed="${h === st.hold}"><span class="n">${holdName(h)}</span><span class="d">vendi al più tardi il ${dt(S.future_days[h - 1])}</span><span class="p">${p100(m.base)} <small>in guadagno</small></span></button>`; }).join('');
}
function optStyle() {
  return S.rules.styles.map(s => { const m = model(s.id, st.hold);
    return `<button type="button" class="opt" data-s="${s.id}" aria-pressed="${s.id === st.style}"><span class="n">${s.nome}</span><span class="d">${s.desc}</span><span class="p">${p100(m.base)} <small>in guadagno</small></span></button>`; }).join('');
}

function renderConsigli() {
  const v = $('#v-consigli'), M = S.mercato, m = model(), sty = styleOf(st.style), t = m.tutti;
  const flat = Math.max(...m.p) - Math.min(...m.p) < 0.005;
  const best = Object.entries(S.models).sort((a, b) => b[1].base - a[1].base)[0];
  const [bs, bh] = best[0].split('|');
  v.innerHTML = `
  <div>

function calibChart(box, cal) {
  const H = 230, [svg, W] = frame(box, H, 'Probabilità stimata e osservata per gruppo di forza');
  const m = {l: 40, r: 8, t: 12, b: 34}, n = cal.length;
  const hi = Math.min(1, Math.max(.7, ...cal.flatMap(c => [c.stimata, c.osservata])) + .05);
  const y = v => m.t + (H - m.t - m.b) * (hi - v) / hi;
  for (let v = 0; v <= hi + 1e-9; v += .2) { el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css('--line')}, svg); text(svg, m.l - 6, y(v) + 4, Math.round(v * 100) + '%', {'text-anchor': 'end'}); }
  el('line', {x1: m.l, x2: W - m.r, y1: y(.5), y2: y(.5), stroke: css('--muted'), 'stroke-dasharray': '3 3'}, svg);
  const slot = (W - m.l - m.r) / n, bw = Math.max(6, Math.min(30, (slot - 14) / 2));
  cal.forEach((c, i) => { const cx = m.l + slot * i + slot / 2;
    [['stimata', '--s1', -1], ['osservata', '--s2', 1]].forEach(([k, col, s]) => el('rect', {x: cx + (s < 0 ? -bw - 1 : 1), y: y(c[k]), width: bw, height: y(0) - y(c[k]), rx: Math.min(4, bw / 2), fill: css(col)}, svg));
    text(svg, cx, H - 18, W < 520 ? String(c.gruppo + 1) + '°' : GROUP_SHORT[c.gruppo], {'text-anchor': 'middle', fill: css('--ink2')});
    text(svg, cx, H - 4, W < 520 ? '' : nf(c.n, 0) + ' op.', {'text-anchor': 'middle'});
    const hb = el('rect', {x: m.l + slot * i, y: m.t, width: slot, height: H - m.t - m.b, fill: 'transparent'}, svg);
    hb.addEventListener('pointermove', ev => { const b = box.getBoundingClientRect(); tip(box, `<div class="t">${GROUP_SHORT[c.gruppo]} · ${nf(c.n, 0)} operazioni</div><div class="r"><span>${swatch(css('--s1'))}Stimata</span><span>${p100(c.stimata)}</span></div><div class="r"><span>${swatch(css('--s2'))}Andata bene davvero</span><span>${p100(c.osservata)}</span></div>`, ev.clientX - b.left, ev.clientY - b.top); });
    hb.addEventListener('pointerleave', () => untip(box)); });
}
function yearsChart(box, years) {
  const H = 230, [svg, W] = frame(box, H, 'Operazioni in guadagno, anno per anno');
  const m = {l: 40, r: 8, t: 12, b: 26}, n = years.length, hi = 1;
  const y = v => m.t + (H - m.t - m.b) * (hi - v) / hi;
  for (let v = 0; v <= 1.0001; v += .25) { el('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: css('--line')}, svg); text(svg, m.l - 6, y(v) + 4, Math.round(v * 100) + '%', {'text-anchor': 'end'}); }
  el('line', {x1: m.l, x2: W - m.r, y1: y(.5), y2: y(.5), stroke: css('--muted'), 'stroke-dasharray': '3 3'}, svg);
  const slot = (W - m.l - m.r) / n, bw = Math.max(4, Math.min(24, (slot - 10) / 2));
  years.forEach((a, i) => { const cx = m.l + slot * i + slot / 2;
    [['top', '--s1', -1], ['tutti', '--s2', 1]].forEach(([k, col, s]) => { const v = a[k].p_gain || 0; el('rect', {x: cx + (s < 0 ? -bw - 1 : 1), y: y(v), width: bw, height: y(0) - y(v), rx: Math.min(4, bw / 2), fill: css(col)}, svg); });
    text(svg, cx, H - 8, (W < 520 ? "'" + a.anno.slice(2) : a.anno) + (a.settimane < 40 ? '*' : ''), {'text-anchor': 'middle'});
    const hb = el('rect', {x: m.l + slot * i, y: m.t, width: slot, height: H - m.t - m.b, fill: 'transparent'}, svg);
    hb.addEventListener('pointermove', ev => { const b = box.getBoundingClientRect(); tip(box, `<div class="t">${a.anno}${a.settimane < 40 ? ' (parziale)' : ''}</div><div class="r"><span>${swatch(css('--s1'))}I primi 10</span><span>${p100(a.top.p_gain)} · media ${pc(a.top.mean, 1)}</span></div><div class="r"><span>${swatch(css('--s2'))}Tutti i titoli in salita</span><span>${p100(a.tutti.p_gain)} · media ${pc(a.tutti.mean, 1)}</span></div>`, ev.clientX - b.left, ev.clientY - b.top); });
    hb.addEventListener('pointerleave', () => untip(box)); });
}

/* ---------------- giudizio: perché sì, perché no (stesse regole ovunque) ---------------- */
// "del 18 %" ma "dell'8 %", "dell'11 %", "dell'1 %", "dell'80 %"
const delp = (x, d = 0) => { const s = pc(x, d, false); return (/^(8|11[ ,]|1[ ,])/.test(s) ? 'dell\u2019' : 'del ') + s; };
const CAT_NOME = {usa: 'le azioni USA', italia: 'le azioni italiane', etf: 'gli ETF azionari', bond: 'gli ETF obbligazionari', oro: 'oro e materie prime'};
function giudizio(s) {
  const m = s.categoria, M = m && D.mercati[m];
  const isFund = /ETF|MUTUALFUND|ETC/i.test(s.type || '') || ['etf', 'bond', 'oro'].includes(m);
  const hold = s.hold || (M ? Number(M.consigliata.key.split('|')[1]) : (isFund ? 63 : 21));
  const hz = s.orizzonti.find(o => o.giorni === hold) || s.orizzonti[2];
  const sim = hz.scenari.prudente, real = hz.storico, aff = hz.affidabilita, st = s.stato || {};
  const minVol = M ? M.min_vol : (isFund ? 0.05 : 0.10);
  const frozen = st.vol3m != null && st.vol3m < minVol;
  // soglie sui numeri arrotondati che si vedono: verdetto e numeri mostrati coincidono sempre
  const per = hz.orizzonte, p = Math.round(sim.p_gain * 100) / 100, p10 = Math.round((sim.p10 != null ? sim.p10 : sim.p5) * 100) / 100;
  const pro = [], contro = [], fatti = [];
  const q = x => Math.round(x * 100);

  if (frozen) contro.push(`<b>Prezzo quasi fermo</b>: negli ultimi 3 mesi ha oscillato del ${pc(st.vol3m, 1, false)} su base annua (normale per questa categoria: almeno ${pc(minVol, 0, false)}). Di solito c'è un'offerta di acquisto in corso: c'è poco da guadagnare.`);
  const realTxt = real ? ` Nella sua storia reale: <b>${q(real.p_gain)} su 100</b> (${nf(real.indipendenti, 0)} periodi di ${per}).` : '';
  if (p >= .6) pro.push(`<b>Buone probabilità</b>: tenendolo ${per}, è finito in guadagno <b>${q(p)} volte su 100</b> nella simulazione prudente.${realTxt}`);
  else if (p >= .5) contro.push(`<b>Quasi testa o croce</b>: tenendolo ${per}, in guadagno ${q(p)} volte su 100 nella simulazione prudente.${realTxt}`);
  else contro.push(`<b>Più probabile perdere che guadagnare</b>: tenendolo ${per}, in guadagno solo ${q(p)} volte su 100 nella simulazione prudente.${realTxt}`);
  if (p10 >= -.10) pro.push(`<b>Rischio contenuto</b>: 1 volta su 10 si perde più ${delp(-p10)}, in ${per}.`);
  else contro.push(`<b>Rischio ${p10 < -.2 ? 'molto ' : ''}alto</b>: 1 volta su 10 si perde più ${delp(-p10)}, in ${per}.`);
  if (s.rendimento > 0) pro.push(`<b>Paga ${isFund && m === 'bond' ? 'cedole' : 'dividendi'}</b>: ${pc(s.rendimento, 1, false)} negli ultimi 12 mesi, sul prezzo di oggi.`);
  const v70 = D.verifica25 && D.verifica25.tutto.calibrazione.find(c => c.da >= .7);
  if (p >= .7 && v70) contro.push(`<b>Stima molto alta</b>: in ${nf(v70.n, 0)} casi degli ultimi 25 anni in cui la stima superava il 70 %, è andata in guadagno davvero il ${p100(v70.vera)}.`);
  if (aff.livello === 'alta') pro.push(`<b>Stima affidabile</b>: ${esc(aff.motivo)}.`);
  else if (aff.livello === 'bassa') contro.push(`<b>Stima poco affidabile</b>: ${esc(aff.motivo)}.`);
  // il trend: lo usa l'algoritmo dei consigli, ma conta solo dove i dati dicono che conta
  if (M && M.trend && M.trend.sopra.n && M.trend.sotto.n && st.sopra_media200 != null) {
    const a = M.trend.sopra.p_gain, b = M.trend.sotto.p_gain, diff = a - b;
    const ver = `dal 2017, con la regola consigliata, ${CAT_NOME[m]} in salita sono andati in guadagno ${q(a)} volte su 100, quelli in discesa ${q(b)}`;
    if (st.sopra_media200) (diff >= .05 ? pro : fatti).push(`<b>È in salita</b> (${pc(st.vs_media200, 0)} rispetto alla media a 200 giorni)${diff >= .05 ? ', e per questa categoria conta' : '. Per questa categoria non ha cambiato molto le cose'}: ${ver}.`);
    else (diff >= .05 ? contro : fatti).push(`<b>È in discesa</b> (${pc(st.vs_media200, 0)} rispetto alla media a 200 giorni)${diff >= .05 ? ', e per questa categoria conta' : diff <= -.05 ? '. Per questa categoria, comprare in discesa è andato perfino meglio' : '. Per questa categoria non ha fatto molta differenza, quindi non è un motivo per evitarlo'}: ${ver}.`);
  }
  // un titolo singolo contro un ETF sul mondo intero, a parità di tempo
  const w = D.simula && D.simula['SWDA.MI'];
  if (w && s.symbol !== 'SWDA.MI' && !isFund) {
    const wh = w.orizzonti.find(o => o.orizzonte === hz.orizzonte);
    if (wh) { const wp = wh.scenari.prudente;
      if (wp.p_gain >= p + .03 || (wp.p10 || wp.p5) > p10 + .03) contro.push(`<b>Un ETF sul mondo intero ha fatto meglio</b>: SWDA (MSCI World), tenuto ${per}, in guadagno ${q(wp.p_gain)} volte su 100 e 1 volta su 10 sotto ${pc(wp.p10 || wp.p5, 0)}. Un titolo singolo concentra il rischio su una sola azienda.`); }
  }
  if (s.calo_massimo != null && s.calo_massimo < -.5) contro.push(`<b>Ha avuto crolli molto profondi</b>: nella sua storia è sceso fino al ${pc(s.calo_massimo, 0)} dal picco.`);
  if (s.currency && s.currency !== 'EUR') contro.push(`<b>È in ${esc(s.currency)}</b>: per chi investe in euro si aggiunge il rischio del cambio, non compreso in questi numeri.`);
  const inOggi = typeof oggiItems === 'function' ? oggiItems().findIndex(x => x.c.symbol === s.symbol) : -1;
  if (inOggi >= 0) pro.push(`<b>È nei consigli di oggi</b>, al posto numero ${inOggi + 1}.`);

  let livello, titolo, frase;
  if (frozen || p < .5 || p10 < -.2) {
    livello = 'no'; titolo = 'Per ora no';
    frase = frozen ? 'Il prezzo è bloccato: non c’è margine per guadagnare.' : p < .5 ? `Tenendolo ${per}, è andato in perdita più spesso che in guadagno (in guadagno ${q(p)} volte su 100).` : `Il rischio è troppo alto: 1 volta su 10 si perde più ${delp(-p10)} in ${per}.`;
  } else if (p >= .6 && p10 >= -.1) {
    livello = 'si'; titolo = 'Sì, ha buone probabilità';
    frase = `Tenendolo ${per}, è finito in guadagno ${q(p)} volte su 100 (di solito ${pc(sim.median)}), e 1 volta su 10 si perdeva più ${delp(-p10)}.`;
  } else {
    livello = 'cautela'; titolo = 'Con cautela';
    frase = p < .6 ? `Le probabilità sono poco sopra il testa o croce: in guadagno ${q(p)} volte su 100 tenendolo ${per} (di solito ${pc(sim.median)}).` : `Le probabilità sono buone (${q(p)} su 100 in ${per}), ma il rischio è alto: 1 volta su 10 si perde più ${delp(-p10)}.`;
  }
  const fonte = `Dati: ${nf(s.anni, s.anni % 1 ? 1 : 0)} anni di prezzi giornalieri di ${esc(tk(s.symbol))} (dal ${dt(s.da, {weekday: undefined, year: 'numeric'})})${M && M.trend ? `; confronto in salita e in discesa su ${nf(M.trend.sopra.n + M.trend.sotto.n, 0)} operazioni della categoria` : ''}. Regole del giudizio: "sì" con almeno 60 su 100 e non più del 10 % di perdita in 1 caso su 10; "no" sotto 50 su 100, oltre il 20 % di perdita in 1 caso su 10 o con il prezzo bloccato.`;
  return {livello, titolo, frase, pro, contro, fatti, fonte, per};
}
function verdettoHTML(g, compatto) {
  const icon = {si: '✓', cautela: '!', no: '✕'}[g.livello];
  const lists = `<div class="vcols"><div><h4>Perché sì</h4>${g.pro.length ? `<ul>${g.pro.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="note">Nessun motivo forte.</p>'}</div>
      <div><h4>Perché no, o attenzione</h4>${g.contro.length ? `<ul>${g.contro.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="note">Nessun segnale contrario forte.</p>'}</div></div>

const curSym = c => ({EUR: '€', USD: '$', GBP: '£', GBp: 'penny', CHF: 'CHF'}[c] || c || '');

function isinOk(code) {
  code = String(code).trim().toUpperCase();
  if (!/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(code)) return false;
  const digits = code.slice(0, 11).split('').map(ch => parseInt(ch, 36)).join('');
  let sum = 0;
  for (let i = 0; i < digits.length; i++) { let n = +digits[digits.length - 1 - i]; if (i % 2 === 0) { n *= 2; if (n > 9) n -= 9; } sum += n; }
  return (10 - sum % 10) % 10 === +code[11];
}
function findSim(q) {
  q = q.trim().toUpperCase(); if (!q) return null;
  const isin = q.match(/[A-Z]{2}[A-Z0-9]{9}[0-9]/);
  if (isin) { const s = SIM_LIST.find(x => x.isin === isin[0]); if (s) return s; }
  const t = q.match(/\(([A-Z0-9.\-]+)\)\s*$/);
  const sym = t ? t[1] : q;
  const s = SIM_LIST.find(x => x.symbol === sym || tk(x.symbol) === sym); if (s) return s;
  if (isin) return null;
  const byName = SIM_LIST.filter(x => x.name.toUpperCase().includes(q));
  return byName.length === 1 ? byName[0] : (byName.length ? {multi: byName.slice(0, 10)} : null);
}

function drawSim(s) {

function lineChart(box, dates, vals, c) {

  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06 || 1; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1), y = v => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  yGrid(svg, m, W, y, lo, hi, v => nf(v, v < 1 ? 3 : v < 10 ? 2 : (v < 20 ? 1 : 0)));
  xLabels(svg, n, x, H, i => dates[i].slice(0, 4), i => i > 0 && dates[i].slice(0, 4) !== dates[i - 1].slice(0, 4), 40);
  el('line', {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: css('--line')}, svg);

// Nell'app pubblicata i dati stanno nell'archivio privato di chi la usa (data/users/<id>/...):
// nessun altro li vede e sopravvivono agli aggiornamenti. Aperta come file, solo in questo browser.
const Store = {
  mode: 'local', db: null, uid: null, docs: {}, stato: {}, queue: Promise.resolve(), cbs: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; this.mode = 'db'; }
      }
    } catch (e) { this.mode = 'local'; }
    for (const name of ['portafoglio', 'demo']) this.watch(name);
  },
  watch(name) {
    const done = (v, info) => { this.docs[name] = v; this.stato[name] = info; (this.cbs[name] || []).forEach(f => f(v, info)); };
    if (this.mode === 'db') {
      const ref = this.db.doc('data/users/' + this.uid + '/' + name);
      let timer = setTimeout(() => done(this.docs[name] || null, {lento: true}), 10000);
      ref.onSnapshot(s => { if (!s.metadata.fromCache) clearTimeout(timer); done(s.exists ? JSON.parse(JSON.stringify(s.data())) : null, {}); },
                     e => { clearTimeout(timer); done(this.docs[name] || null, {errore: e.code}); });
    } else {
      let v = null; try { v = JSON.parse(localStorage.getItem('finanza-' + name) || 'null'); } catch (e) {}
      done(v, {locale: true});
    }
  },
  on(name, f) { (this.cbs[name] = this.cbs[name] || []).push(f); if (name in this.docs) f(this.docs[name], this.stato[name]); },
  save(name, data) {
    this.docs[name] = data;
    if (this.mode === 'db') {
      const ref = this.db.doc('data/users/' + this.uid + '/' + name);
      this.queue = this.queue.then(() => ref.set(data)).catch(e => avviso('Non riesco a salvare (' + (e && e.code || 'errore') + '). Riprova tra poco.'));
    } else { try { localStorage.setItem('finanza-' + name, JSON.stringify(data)); } catch (e) {} }
    (this.cbs[name] || []).forEach(f => f(data, this.stato[name]));
  },
  nota() {
    return this.mode === 'db' ? 'Salvato nel tuo archivio privato dell’app: lo vedi solo tu, da qualsiasi dispositivo.'
                              : 'Salvato solo in questo browser (aperta fuori da Claude non c’è l’archivio personale).';
  },
};
function avviso(msg) { const t = $('#toast'); if (!t) return; t.textContent = msg; t.hidden = false; clearTimeout(avviso.t); avviso.t = setTimeout(() => { t.hidden = true; }, 4500); }

function giorniPiu(s, data, n) {
  // la data di vendita: il giorno n contando il giorno di acquisto come primo (giorni di borsa, o di calendario per le crypto)
  if (s.calendario === 'sempre') { const d = new Date(data + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n - 1); return d.toISOString().slice(0, 10); }
  const cal = (D.calendari || {})[s.calendario] || [];

});

      movimenti: (DEMO.movimenti || []).concat([{d: s.a, tipo: 'Compra', sym: s.symbol, qty, prezzo: s.prezzo, eur: Math.round(speso * 100) / 100}]).slice(-300)}));
    avviso(`Comprato: ${nf(qty, qty % 1 ? 4 : 0)} ${tk(s.symbol)} per ${eur(speso)}. Piano: tienilo ${holdTxt(s)}.`);
  });
  v.querySelectorAll('[data-sell]').forEach(b => b.addEventListener('click', () => {
    const sym = b.dataset.sell, s = SIM[sym], p = DEMO.posizioni[sym]; if (!s || !p) return;

    const pos = Object.assign({}, DEMO.posizioni); delete pos[sym];

      movimenti: (DEMO.movimenti || []).concat([{d: s.a, tipo: 'Vendi', sym, qty: p.qty, prezzo: s.prezzo, eur: Math.round(ricavo * 100) / 100, esito}]).slice(-300)}));
    const lez = n < (s.hold * (s.calendario === 'sempre' ? 1 : 1)) * 0.5 ? ` Hai venduto molto prima del tempo consigliato: nei dati, uscire presto ha ridotto le operazioni in guadagno.` : '';
    avviso(`Venduto ${tk(sym)}: ${esito}.${lez}`);
  }));
  $('#dm-reset').addEventListener('click', e => {
    const b = e.target; if (b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = 'Sicuro? Tocca di nuovo per cancellare tutto e ricominciare'; return; }

  });
  draw.demo();
}

        <tbody>${T.gruppi.map(g => `<tr><td class="l">${esc(g.gruppo)}</td><td>${p100(g.stimata)}</td><td><b>${p100(g.vera)}</b></td></tr>`).join('')}</tbody></table></div></div>
    </div>
    ${alt.length ? `<h3 style="margin-top:14px">Miglioramenti provati</h3><p class="note">Valutati anno per anno su anni che non avevano visto. Il numero è quanto prevedono meglio di chi dice sempre la media (0 = uguale).</p>
      <ul class="note" style="margin:6px 0 0;padding-left:18px">${alt.map(a => `<li><b>${esc(a.nome)}</b>: ${(a.skill >= 0 ? '+' : '') + nf(a.skill * 100, 2)} %${a.nome === 'attuale' ? ' (quella in uso)' : att && a.skill <= att.skill + 0.001 ? ', non migliora: scartato' : ', differenza troppo piccola per cambiare'}</li>`).join('')}</ul>
      <p class="note" style="margin-top:6px">Nessuna variante prevede in modo apprezzabilmente migliore: le differenze tra strumenti dello stesso gruppo sono soprattutto rumore. Quello che conta, e che il giudizio usa, è la categoria, il tempo e il rischio.</p>` : ''}
  </div>`;
}

/* ---------------- come funziona ---------------- */
function renderMetodo() {
  const R = S.rules;
  $('#v-metodo').innerHTML = `<div class="card"><div class="prose">
    <h1>Come funziona</h1>
    <h3>1. Quali titoli guarda</h3>
    <p>I titoli dell'<b>S&amp;P 100</b> (USA) e del <b>FTSE MIB</b> (Italia). Tiene solo quelli <b>in salita</b>: prezzo sopra la sua media degli ultimi 200 giorni di borsa. Esclude quelli con il prezzo quasi fermo (meno del 10 % di oscillazione in un anno), perché di solito sono bloccati da un'offerta di acquisto.</p>
    <h3>2. Quando comprare e quando vendere</h3>
    <p><b>Compra</b> alla seduta successiva con un ordine a prezzo massimo: l'ultima chiusura più mezza oscillazione media giornaliera. Se il prezzo è più alto, non si compra. <b>Vendi</b> al primo di tre segnali: l'<b>obiettivo</b> (prezzo di guadagno), la <b>protezione</b> (prezzo di uscita in perdita, lo stop-loss) o la <b>data</b>. L'oscillazione media giornaliera è la media degli ultimi ${R.atr_win} giorni: le protezioni si misurano in oscillazioni, così si adattano a quanto si muove ogni titolo.</p>
    <p>${R.styles.map(s => `<b>${s.nome}</b>: ${s.desc}`).join('<br>')}</p>
    <h3>3. Come calcola la probabilità</h3>
    <p>Per ogni settimana degli ultimi ~9 anni ha rifatto la stessa operazione su <b>tutti i titoli in salita</b>, con i soli prezzi disponibili quel giorno. Li ha divisi in cinque gruppi per <b>forza dell'ultimo anno</b> (rendimento da 12 a 1 mese fa diviso per la volatilità, Jegadeesh e Titman, 1993). La probabilità di un titolo è la frequenza con cui le operazioni del suo gruppo sono finite in guadagno, costi inclusi, leggermente avvicinata alla media per non fidarsi dei gruppi piccoli. In letteratura i titoli più forti non fanno peggio dei più deboli: se i dati dicono il contrario, è considerato rumore e la probabilità resta uguale per tutti.</p>
    <h3>4. Cosa è stato provato e scartato</h3>
    <p><b>Un modello con sei indizi</b> (forza, ultimo mese, vicinanza al massimo, calma del prezzo, distanza dalla media, mercato): sui dati che non aveva visto, quando diceva 57 % è andata bene il 46 %. Peggio del caso, quindi scartato. <b>La storia del singolo titolo</b>: chi è andato bene in passato non va meglio dopo. Scartata. <b>Il risultato:</b> con i soli prezzi, la probabilità di riuscita a poche settimane dipende pochissimo dal titolo; dipende soprattutto da quanto tieni e da come esci.</p>
    <h3>5. I consigli di oggi</h3>
    <p>Stesso metodo su cinque categorie: <b>ETF azionari</b> e <b>ETF obbligazionari</b> (UCITS quotati su Borsa Italiana, acquistabili da chi investe dall'Italia; gli ETF americani di solito no, per la regola europea sui documenti KID), <b>oro e materie prime</b> (ETC), <b>azioni USA</b> e <b>azioni italiane</b>. Un solo ETF per indice, per non contare due volte la stessa cosa. Le singole obbligazioni (BTP, bond societari) non hanno prezzi giornalieri gratuiti affidabili: sono coperte dagli ETF obbligazionari. Per ogni categoria la regola consigliata è quella con <b>più operazioni in guadagno dal 2017</b>, tra quelle in cui <b>nel 10 % dei casi peggiori non si è perso più del 10 %</b>. Le cedole e i dividendi sono quelli pagati negli ultimi 12 mesi, sul prezzo di oggi; gli ETF ad accumulo non ne pagano perché li reinvestono. Sugli ETF non c'è la Tobin tax: costo 0,1 % per operazione.</p>
    <h3>Il mio portafoglio, Esercitati, Crypto</h3>
    <p><b>Il mio portafoglio</b> applica a ogni titolo che possiedi la regola della sua categoria: <b>TIENI</b> fino alla data di vendita (il periodo consigliato, contato in giorni di borsa dal giorno di acquisto, o di calendario per le crypto); <b>VENDI</b> quando la data è passata o se il prezzo è bloccato; <b>RINNOVA</b> se la data è passata ma oggi il giudizio è ancora "Sì". Non si vende prima per paura del saliscendi: dal 2017 le uscite anticipate (le protezioni) hanno ridotto le operazioni in guadagno in tutte le categorie. <b>Esercitati</b> è un conto finto da 10.000 €, ai prezzi di chiusura dell'ultimo aggiornamento, con i costi (0,1 % per operazione, Tobin tax sulle azioni italiane, 0,2 % sulle crypto) e il cambio euro/dollaro. I dati di entrambi stanno nel tuo archivio privato dell'app: li vedi solo tu. <b>Crypto</b>: le 12 principali in euro, con le stesse regole; si scambiano tutti i giorni, quindi 3 mesi sono 91 giorni di calendario.</p>
    <h3>Crypto intraday</h3>
    <p>Per ogni crypto due piani validi 24 ore: <b>comprare un ribasso</b> (ordine limite 3 escursioni orarie sotto il prezzo, protezione 3 escursioni sotto, obiettivo il prezzo di partenza) e <b>comprare una rottura</b> (ordine sopra il massimo delle ultime 24 ore, protezione 1,5 escursioni sotto, obiettivo il doppio del rischio). Le regole sono state fissate prima di guardare i dati e verificate sulle candele orarie degli ultimi 2 anni, separando il primo anno dal secondo: con i costi nessuna ha guadagnato in media, e l'app lo scrive.</p>
    <h3>La verifica di 25 anni</h3>
    <p>Ogni mese dal 2004, per tutti gli strumenti, la probabilità di guadagno è stata rifatta con i soli prezzi di quel giorno e confrontata con com'è andata (<code>python3 verifica.py</code>). In media è prudente di un paio di punti; i "Sì" sono andati in guadagno più spesso dei "Con cautela" e dei "Per ora no", con perdite più piccole. Tre modi per migliorarla (miscela con la frequenza del gruppo, ricalibratura per tutti e per gruppo) sono stati provati su anni mai visti e nessuno prevede meglio: la stima resta quella prudente, con un avviso sopra il 70 %, dove in passato è stata troppo ottimista.</p>
    <h3>Perché sì e perché no</h3>
    <p>Per ogni strumento, nei consigli e nella ricerca per ISIN, il giudizio segue sempre le stesse regole, sul periodo consigliato per la sua categoria (3 mesi per ETF e oro, 1 mese per le azioni): <b>Sì</b> se nella simulazione prudente è finito in guadagno almeno 60 volte su 100 e nel 10 % dei casi peggiori non ha perso più del 10 %; <b>Per ora no</b> se in guadagno meno di 50 volte su 100, se nel 10 % peggiore ha perso più del 20 % o se il prezzo è bloccato; altrimenti <b>Con cautela</b>. Ogni motivo riporta i numeri da cui viene: la storia reale dello strumento, la simulazione, le cedole, l'affidabilità e il confronto con un ETF sul mondo intero.</p>
    <p><b>Il trend, verificato.</b> I consigli guardano gli strumenti in salita (sopra la media a 200 giorni), ma dal 2017 essere in salita ha aumentato le probabilità solo per gli ETF obbligazionari (58 contro 51 su 100). Per azioni ed ETF azionari non ha cambiato molto; per l'oro è andato meglio comprare in discesa. Per questo "è in discesa" diventa un motivo per non comprare solo dove i dati lo confermano, e l'app lo scrive con i numeri.</p>
    <h3>6. Simula un titolo dall'ISIN</h3>
    <p>Per ogni titolo usa fino a <b>25 anni</b> di prezzi giornalieri. <b>Com'è andata davvero</b>: su tutte le finestre reali della storia (ogni giorno, ogni settimana, ogni mese, ogni anno), quante volte il prezzo è salito. <b>Macchina del Tempo</b>: 10.000 futuri fatti di pezzi veri della storia; per 1 anno incolla 12 mesi veri presi a caso, così ottiene 10.000 anni possibili invece dei pochi reali. La crescita di fondo viene tolta e rimessa secondo tre scenari: <b>nessuna crescita</b>, <b>prudente</b> (la crescita passata ridotta: le vere differenze di crescita attesa tra grandi titoli sono di pochi punti l'anno, il resto è soprattutto fortuna) e <b>come in passato</b>.</p>
    <p><b>Affidabilità</b>: <b>alta</b> se ci sono almeno 100 periodi indipendenti nella storia e gli scenari di crescita cambiano il risultato di non più di 10 punti; <b>media</b> con almeno 20 periodi e non più di 20 punti; altrimenti <b>bassa</b>. A 1 anno è quasi sempre media o bassa: in 25 anni ci sono solo 25 anni indipendenti, e quanto crescerà un titolo è proprio la cosa più incerta.</p>
    <h3>Titoli italiani</h3>
    <p>Prezzi in euro, calendario di Borsa Italiana (chiusa a Capodanno, Venerdì Santo, Pasquetta, 1° maggio, Ferragosto, 24, 25, 26 e 31 dicembre), costo 0,2 % per operazione perché sugli acquisti di azioni italiane si paga la <b>Tobin tax dello 0,1 %</b>. Sui guadagni si paga il 26 % di imposta, qui non considerato.</p>
    <h3>Limiti</h3>
    <p>L'elenco dei titoli è quello di oggi: chi è uscito dagli indici perché è andato male non c'è, quindi i numeri sono un po' ottimisti. Nel passato l'esecuzione è ideale; nella realtà ci sono spread, salti di prezzo e tasse. Una protezione è un ordine, non una garanzia: con un salto può eseguirsi più in basso.</p>
    <h3>Aggiornamento</h3>
    <p>${D.aggiornato ? `Ultimo aggiornamento: ${dtl(D.aggiornato.slice(0, 10))} alle ${D.aggiornato.slice(11, 16)} (ora italiana). ` : ''}L'algoritmo usa i prezzi di <b>chiusura</b>: durante la seduta non cambierebbe nulla, quindi l'app si aggiorna dopo la chiusura di Milano e di New York. A mano: <code>python3 app.py</code> nel repository.</p>
    <p><a href="#daytrade">Esempio di day trade con la Macchina del Tempo</a> (dati di prova del 19 ottobre 2026): per chi opera in giornata, l'operazione con le probabilità più basse.</p>

  </div></div>`;
}
